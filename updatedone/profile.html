<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Progressive Web App Meta -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#2563eb" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Mohna Express" />
<link rel="apple-touch-icon" href="https://img.icons8.com/color/192/lightning-bolt.png" />
  <title>Mohna Express - Account Profile</title>

  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body class="theme-retail">

<div class="app-container">
  
  <header class="app-header">
    <a href="index.html" class="brand-logo">
      <span>⚡</span> Mohna Express
    </a>
    <div class="header-right-actions">
      <div class="notif-bell-btn" onclick="openNotificationsModal()" title="Live Order Updates">
        🔔
        <span id="notifBadge" class="notif-badge-count" style="display:none;">0</span>
      </div>
      <div id="authHeaderContainer">
        <a href="profile.html" class="auth-pill auth-logged-out" id="headerAuthPill">
          🔑 Sign In
        </a>
      </div>
    </div>
  </header>

  <!-- PROFILE PAGE VIEW -->
  <div id="profilePage" class="page-view active-page">
    <div class="card">
      <h3 style="margin-top:0;">👤 Account Profile</h3>

      <div class="profile-avatar-container">
        <img id="profAvatarDisplay" class="profile-img-preview" src="https://via.placeholder.com/96?text=User" alt="Avatar" />
        <input type="file" id="avatarFileInput" accept="image/*" style="display: none;" onchange="handleAvatarFileSelected(event)" />
        <div class="profile-photo-actions">
          <button type="button" class="btn-photo-action" onclick="document.getElementById('avatarFileInput').click()">📸 Select Photo</button>
          <button type="button" id="btnSaveAvatar" class="btn-photo-action btn-photo-save" style="display:none;" onclick="saveSelectedAvatar()">💾 Save Photo</button>
          <button type="button" class="btn-photo-action" style="color:#b91c1c;" onclick="deleteAvatarPhoto()">🗑️ Delete</button>
        </div>
      </div>

      <div class="form-group">
        <label>Wallet Balance (Late Guarantee Credits & Top-ups)</label>
        <div style="display:flex; gap:6px;">
          <input type="text" id="profWallet" readonly style="font-weight:900; color:#16a34a; font-size:16px; flex:1;" />
          <button type="button" class="btn-submit" style="width:auto; padding:8px 14px; background:#15803d; font-size:12px;" onclick="openTopUpWalletModal()">+ Top Up</button>
        </div>
      </div>

      <div class="form-group"><label>Username</label><input type="text" id="profUsername" readonly style="font-weight:bold; color:#0f172a;" /></div>
      <div class="form-group"><label>Full Name</label><input type="text" id="profName" readonly /></div>
      <div class="form-group"><label>Mobile Number</label><input type="tel" id="profPhone" readonly /></div>
      <div class="form-group"><label>Email Address</label><input type="email" id="profEmail" readonly /></div>
      <div class="form-group"><label>📍 Registered Location (Signup)</label><input type="text" id="profRegCoords" readonly /></div>
      <div class="form-group"><label>📍 Latest Login Location</label><input type="text" id="profLoginCoords" readonly /></div>
      <div class="form-group"><label>Account Status</label><input type="text" id="profStatus" readonly style="font-weight:bold; color:#15803d;" /></div>
      
      <button class="btn-submit" style="background:#0284c7; margin-top:10px;" onclick="openMyReviewsModal()">⭐ View My Product Reviews & Feedback</button>
      <button class="btn-submit" style="background:#ef4444; margin-top:8px;" onclick="logoutCustomer()">🚪 Log Out</button>
    </div>
  </div>

</div>

<!-- TOP UP WALLET MODAL -->
<div id="topUpWalletModal" class="modal-overlay" style="display:none;">
  <div class="modal-card">
    <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #e2e8f0; padding-bottom:8px; margin-bottom:12px;">
      <h3 style="margin:0; color:#0f172a;">🪙 Add Money to Wallet</h3>
      <button type="button" onclick="closeTopUpWalletModal()" style="background:none; border:none; font-size:18px; cursor:pointer; color:#64748b;">✕</button>
    </div>
    <p style="font-size:13px; color:#475569; margin:0 0 10px 0;">Select or enter top-up amount:</p>
    <div style="display:flex; gap:6px; margin-bottom:10px;">
      <button type="button" class="auth-tab-btn" onclick="document.getElementById('topUpCustomAmount').value=100">₹100</button>
      <button type="button" class="auth-tab-btn" onclick="document.getElementById('topUpCustomAmount').value=200">₹200</button>
      <button type="button" class="auth-tab-btn" onclick="document.getElementById('topUpCustomAmount').value=500">₹500</button>
    </div>
    <div class="form-group">
      <input type="number" id="topUpCustomAmount" min="10" placeholder="Enter custom amount in ₹" />
    </div>
    <button type="button" id="btnPayTopUp" class="btn-submit" style="background:#15803d;" onclick="processWalletTopUpPayment()">💳 Pay & Add Balance</button>
    <button type="button" class="btn-submit" style="background:#f1f5f9; color:#475569; border:1px solid #cbd5e1; margin-top:8px;" onclick="closeTopUpWalletModal()">Cancel</button>
  </div>
</div>

<!-- MY REVIEWS MODAL -->
<div id="myReviewsModal" class="modal-overlay" style="display:none;">
  <div class="modal-card">
    <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #e2e8f0; padding-bottom:8px; margin-bottom:12px;">
      <h3 style="margin:0; color:#0f172a;">⭐ My Published Reviews</h3>
      <button type="button" onclick="closeMyReviewsModal()" style="background:none; border:none; font-size:18px; cursor:pointer; color:#64748b;">✕</button>
    </div>
    <div id="myReviewsModalList" style="max-height:300px; overflow-y:auto;">
      <p style="text-align:center; color:#94a3b8; font-size:13px;">Loading your reviews...</p>
    </div>
    <button type="button" class="btn-submit" style="background:#f1f5f9; color:#475569; border:1px solid #cbd5e1; margin-top:12px;" onclick="closeMyReviewsModal()">Close</button>
  </div>
</div>

<!-- NOTIFICATIONS MODAL -->
<div id="notificationsModal" class="modal-overlay" style="display:none;">
  <div class="modal-card">
    <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #e2e8f0; padding-bottom:8px; margin-bottom:12px;">
      <h3 style="margin:0; color:#0f172a;">🔔 Live Order Notifications</h3>
      <button type="button" onclick="closeNotificationsModal()" style="background:none; border:none; font-size:18px; cursor:pointer; color:#64748b;">✕</button>
    </div>
    <div id="notificationsList">
      <p style="text-align:center; color:#94a3b8; font-size:13px;">No new dispatch notifications.</p>
    </div>
    <button type="button" class="btn-submit" style="background:#f1f5f9; color:#475569; border:1px solid #cbd5e1; margin-top:12px;" onclick="closeNotificationsModal()">Close</button>
  </div>
</div>

<!-- DYNAMIC MOHNA POPUP NOTIFICATION MODAL CONTAINER -->
<div id="mohnaPopupContainer"></div>

<!-- BOTTOM NAVIGATION -->
<nav class="bottom-nav">
  <a href="index.html" class="nav-item"><span>🏠</span> Home</a>
  <a href="checkout.html" class="nav-item">
    <div id="cartBadgeCount" class="cart-nav-badge" style="display:none;">0</div>
    <span>💳</span> Checkout
  </a>
  <a href="orders.html" class="nav-item"><span>📦</span> My Orders</a>
  <a href="profile.html" class="nav-item active"><span>👤</span> Profile</a>
</nav>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="script.js"></script>
<script>
  window.addEventListener('DOMContentLoaded', () => {
    fetchInitialStoreData();
    renderProfilePage();
  });
</script>
</body>
</html>
