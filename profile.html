<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile - Mohna Express</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #fdf2f8; min-height: 100vh; padding: 16px 16px 80px 16px; }
    .container { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
    .card { background: white; border-radius: 16px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); text-align: center; }
    .avatar { width: 90px; height: 90px; border-radius: 50%; background: #e2e8f0; object-fit: cover; margin: 0 auto 12px; }
    .btn-logout { width: 100%; padding: 12px; background: #fee2e2; color: #b91c1c; border: 1px solid #fecaca; border-radius: 10px; font-weight: 700; cursor: pointer; margin-top: 20px; }
  </style>
</head>
<body>

<div class="container">
  <div class="card">
    <img id="profileImage" class="avatar" src="https://via.placeholder.com/90" />
    <h3 id="profName">Loading Name...</h3>
    <p id="profPhone" style="color:#64748b; font-size:13px;"></p>
    <p id="profEmail" style="color:#64748b; font-size:13px;"></p>

    <button class="btn-logout" onclick="confirmLogout()">🚪 Logout Account</button>
  </div>
</div>

<script>
  window.onload = function() {
    const user = JSON.parse(localStorage.getItem("mohna_user") || "{}");
    if (!user.id) {
      window.location.href = "auth.html";
      return;
    }
    document.getElementById("profName").innerText = user.name;
    document.getElementById("profPhone").innerText = `📞 ${user.phone}`;
    document.getElementById("profEmail").innerText = `✉️ ${user.email}`;
  };

  function confirmLogout() {
    if (confirm("Are you sure you want to log out from this device?")) {
      localStorage.removeItem("mohna_user");
      window.location.href = "auth.html";
    }
  }
</script>
</body>
</html>
