<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Special Space | Her</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    :root {
      --bg: #fff1f2; --card: #ffffff; --accent: #f43f5e;
      --text: #881337; --danger: #e11d48; --success: #10b981;
    }
    body {
      margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text); display: flex; flex-direction: column;
      align-items: center; justify-content: center; min-height: 100vh;
    }
    .card {
      background: var(--card); border-radius: 24px; padding: 24px; width: 90%; max-width: 500px;
      box-shadow: 0 10px 25px rgba(244,63,94,0.15); text-align: center; border: 1px solid #ffe4e6;
    }
    .status-dot {
      height: 10px; width: 10px; border-radius: 50%; display: inline-block; margin-right: 6px;
    }
    .online { background: var(--success); }
    .offline { background: #cbd5e1; }
    .video-grid {
      position: relative; width: 100%; height: 280px; background: #ffe4e6;
      border-radius: 16px; margin: 16px 0; overflow: hidden;
    }
    #remoteVideo { width: 100%; height: 100%; object-fit: cover; }
    #localVideo {
      position: absolute; bottom: 12px; right: 12px; width: 100px; height: 75px;
      border-radius: 12px; object-fit: cover; border: 2px solid var(--accent);
    }
    .btn-group { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    button {
      padding: 10px 20px; border: none; border-radius: 20px; font-weight: 600;
      cursor: pointer; transition: 0.2s;
    }
    .btn-call { background: var(--accent); color: white; box-shadow: 0 4px 12px rgba(244,63,94,0.3); }
    .btn-end { background: var(--danger); color: white; display: none; }
    .btn-action { background: #ffe4e6; color: var(--text); }
  </style>
</head>
<body>

  <div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h2 style="margin:0; font-weight:700;">Her Sanctuary ✨</h2>
      <div style="font-size:13px;"><span id="statusDot" class="status-dot offline"></span><span id="statusText">Connecting...</span></div>
    </div>

    <div class="video-grid">
      <video id="remoteVideo" autoplay playsinline></video>
      <video id="localVideo" autoplay playsinline muted></video>
    </div>

    <div class="btn-group">
      <button id="callBtn" class="btn-call" onclick="startCall()">📞 Call Him</button>
      <button id="endBtn" class="btn-end" onclick="endCall()">📴 End Call</button>
      <button class="btn-action" onclick="toggleMic()">🎤 Mic</button>
      <button class="btn-action" onclick="toggleCam()">📷 Cam</button>
    </div>
  </div>

  <script>
    const myId = "room-2026-user-her";
    const targetId = "room-2026-user-him";
    let peer = new Peer(myId);
    let localStream = null, currentCall = null;

    peer.on('open', () => {
      document.getElementById('statusDot').className = 'status-dot online';
      document.getElementById('statusText').innerText = 'Online 🌸';
    });

    peer.on('call', (call) => {
      navigator.mediaDevices.getUserMedia({ video: true, audio: true }).then((stream) => {
        localStream = stream;
        document.getElementById('localVideo').srcObject = stream;
        call.answer(stream);
        handleCallEvents(call);
      });
    });

    function startCall() {
      navigator.mediaDevices.getUserMedia({ video: true, audio: true }).then((stream) => {
        localStream = stream;
        document.getElementById('localVideo').srcObject = stream;
        const call = peer.call(targetId, stream);
        handleCallEvents(call);
      }).catch(err => alert("Camera/Mic permission needed: " + err));
    }

    function handleCallEvents(call) {
      currentCall = call;
      document.getElementById('callBtn').style.display = 'none';
      document.getElementById('endBtn').style.display = 'inline-block';

      call.on('stream', (remoteStream) => {
        document.getElementById('remoteVideo').srcObject = remoteStream;
      });
      call.on('close', () => resetCallUI());
    }

    function endCall() {
      if (currentCall) currentCall.close();
      if (localStream) localStream.getTracks().forEach(t => t.stop());
      resetCallUI();
    }

    function resetCallUI() {
      document.getElementById('callBtn').style.display = 'inline-block';
      document.getElementById('endBtn').style.display = 'none';
      document.getElementById('remoteVideo').srcObject = null;
      document.getElementById('localVideo').srcObject = null;
    }

    function toggleMic() {
      if (localStream) {
        const audio = localStream.getAudioTracks()[0];
        if (audio) audio.enabled = !audio.enabled;
      }
    }

    function toggleCam() {
      if (localStream) {
        const video = localStream.getVideoTracks()[0];
        if (video) video.enabled = !video.enabled;
      }
    }
  </script>
</body>
</html>
