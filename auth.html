<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login / Signup - Mohna Express</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #fdf2f8; min-height: 100vh; padding: 20px; display: flex; align-items: center; justify-content: center; }
    .auth-card { background: white; border-radius: 20px; padding: 24px; width: 100%; max-width: 400px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    h2 { font-size: 20px; color: #0f172a; margin-bottom: 6px; }
    p { font-size: 13px; color: #64748b; margin-bottom: 16px; }
    .form-group { margin-bottom: 12px; }
    label { font-size: 12px; font-weight: 700; color: #475569; display: block; margin-bottom: 4px; }
    input, select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; }
    .btn-auth { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 10px; font-weight: 700; font-size: 14px; cursor: pointer; margin-top: 8px; }
    .toggle-link { text-align: center; margin-top: 14px; font-size: 13px; color: #2563eb; cursor: pointer; }
    .status-alert { background: #fef3c7; color: #92400e; padding: 8px 12px; border-radius: 8px; font-size: 12px; margin-bottom: 12px; }
  </style>
</head>
<body>

<div class="auth-card">
  <div id="loginSection">
    <h2>⚡ Customer Sign In</h2>
    <p>Access your orders and expedited delivery</p>
    <div class="status-alert" id="geoStatus">📍 Detecting required delivery coordinates...</div>
    <form onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>Mobile Number or Email</label>
        <input type="text" id="loginIdentifier" required placeholder="Enter phone or email" />
      </div>
      <button type="submit" class="btn-auth" id="btnLoginSubmit" disabled>Sign In</button>
    </form>
    <div class="toggle-link" onclick="toggleAuth(true)">New User? Register here</div>
  </div>

  <div id="registerSection" style="display:none;">
    <h2>📝 Create Account</h2>
    <p>Instant access to retail and bulk stores</p>
    <form onsubmit="handleSendOtp(event)" id="signupForm">
      <div class="form-group"><label>Full Name</label><input type="text" id="regName" required /></div>
      <div class="form-group"><label>Mobile Number</label><input type="tel" id="regPhone" required /></div>
      <div class="form-group"><label>Email Address</label><input type="email" id="regEmail" required /></div>
      <div class="form-group">
        <label>Gender</label>
        <select id="regGender" required>
          <option value="Male">Male</option>
          <option value="Female">Female</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <button type="submit" class="btn-auth" id="btnOtpSubmit" disabled>Send Email OTP</button>
    </form>

    <div id="otpVerificationArea" style="display:none; margin-top: 14px;">
      <div class="form-group">
        <label>Enter 6-Digit Email OTP</label>
        <input type="number" id="otpCode" placeholder="123456" />
      </div>
      <button type="button" class="btn-auth" style="background:#16a34a;" onclick="handleVerifyRegister()">Complete Verification</button>
    </div>

    <div class="toggle-link" onclick="toggleAuth(false)">Already registered? Sign In</div>
  </div>
</div>

<script>
  const SPREADSHEET_API_URL = "https://script.google.com/macros/s/AKfycbxVDobxg66c0QCfhrPFRj-l4T8cAWLJR_HBrMyrYJgAQESRxNjP7R7ripoFQnSpBe5R/exec";
  let userCoords = null;

  window.onload = function() {
    acquireMandatoryLocation();
  };

  function acquireMandatoryLocation() {
    if (!navigator.geolocation) {
      document.getElementById("geoStatus").innerText = "❌ Geolocation unsupported on this device.";
      return;
    }
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        userCoords = `${pos.coords.latitude.toFixed(6)}, ${pos.coords.longitude.toFixed(6)}`;
        document.getElementById("geoStatus").innerText = `✅ GPS Locked: ${userCoords}`;
        document.getElementById("btnLoginSubmit").disabled = false;
        document.getElementById("btnOtpSubmit").disabled = false;
      },
      () => {
        document.getElementById("geoStatus").innerText = "⚠️ Location access is mandatory to continue.";
      }
    );
  }

  function toggleAuth(showRegister) {
    document.getElementById("loginSection").style.display = showRegister ? "none" : "block";
    document.getElementById("registerSection").style.display = showRegister ? "block" : "none";
  }

  function handleLogin(e) {
    e.preventDefault();
    if (!userCoords) return alert("Please allow GPS location.");
    
    fetch(SPREADSHEET_API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({
        action: "login",
        identifier: document.getElementById("loginIdentifier").value.trim(),
        coords: userCoords
      })
    })
    .then(r => r.json())
    .then(res => {
      if (res.success) {
        localStorage.setItem("mohna_user", JSON.stringify(res.user));
        window.location.href = "home.html";
      } else {
        alert(res.message);
      }
    });
  }

  function handleSendOtp(e) {
    e.preventDefault();
    const email = document.getElementById("regEmail").value.trim();
    fetch(SPREADSHEET_API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "sendOtp", email: email })
    }).then(r => r.json()).then(res => {
      if (res.success) {
        alert("OTP sent to your email!");
        document.getElementById("otpVerificationArea").style.display = "block";
      }
    });
  }

  function handleVerifyRegister() {
    const payload = {
      action: "verifyOtpAndRegister",
      name: document.getElementById("regName").value.trim(),
      phone: document.getElementById("regPhone").value.trim(),
      email: document.getElementById("regEmail").value.trim(),
      gender: document.getElementById("regGender").value,
      coords: userCoords,
      otp: document.getElementById("otpCode").value.trim()
    };

    fetch(SPREADSHEET_API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    })
    .then(r => r.json())
    .then(res => {
      if (res.success) {
        localStorage.setItem("mohna_user", JSON.stringify(res.user));
        alert("Registration complete!");
        window.location.href = "home.html";
      } else {
        alert(res.message);
      }
    });
  }
</script>
</body>
</html>
