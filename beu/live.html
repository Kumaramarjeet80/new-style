<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Broadcast Theater - GEC Munger</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- PeerJS Client Library for WebRTC -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <link rel="stylesheet" href="css/theme.css">

  <style>
    .theater-container {
      max-width: 720px;
      margin: 0 auto;
      padding: 20px 16px 60px 16px;
    }
    .live-theater-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border-subtle);
      border-radius: var(--card-radius);
      padding: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }
    .video-viewport {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
    }
    .video-viewport video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .theater-controls-row {
      display: flex;
      gap: 12px;
      margin-bottom: 14px;
    }
    .theater-btn {
      flex: 1;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-subtle);
      color: #fff;
      padding: 10px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s;
    }
    .theater-btn:hover {
      background: rgba(255, 255, 255, 0.12);
    }
  </style>
</head>
<body>

  <!-- Top Navigation Bar -->
  <header class="portal-navbar">
    <a href="index.html" class="portal-brand">
      <span>GECM</span> Live Theater
    </a>
    <a href="index.html" class="btn-back-to-catalog" style="padding: 6px 12px; font-size: 11.5px;">
      ← Back to Catalog
    </a>
  </header>

  <main class="theater-container">

    <!-- Live Theater Box -->
    <div class="live-theater-card">
      
      <!-- Topic Title Inside the Box Above Video -->
      <h1 id="streamTitle" style="font-size: 20px; font-weight: 800; color: #fff; margin: 0 0 14px 0; letter-spacing: -0.4px;">Connecting to Live Session...</h1>

      <!-- Broadcast Viewport -->
      <div class="video-viewport" id="videoViewport">
        <video id="liveVideoPlayer" autoplay playsinline></video>

        <!-- Connecting / Offline Overlay -->
        <div id="streamLoadingState" style="position: absolute; display: flex; flex-direction: column; align-items: center; gap: 12px; color: #94a3b8; text-align: center; padding: 20px;">
          <div class="spinner"></div>
          <span style="font-size: 13.5px; font-weight: 600;">Connecting to secure live video stream...</span>
        </div>

        <!-- Live Indicator Tag -->
        <div style="position: absolute; top: 12px; left: 12px; background: rgba(239, 68, 68, 0.9); color: #fff; font-size: 10.5px; font-weight: 800; padding: 3px 8px; border-radius: 6px; display: flex; align-items: center; gap: 5px; text-transform: uppercase;">
          <span class="live-pulse-dot" style="background-color: #fff; box-shadow: 0 0 6px #fff;"></span> LIVE
        </div>
      </div>

      <!-- Controls Row -->
      <div class="theater-controls-row">
        <button id="btnUnmuteAudio" type="button" class="theater-btn">
          🔊 Unmute Audio
        </button>
        <button id="btnFullscreen" type="button" class="theater-btn">
          ⛶ Fullscreen
        </button>
      </div>

      <!-- Highlighted Timestamp & Description -->
      <div style="font-size: 12.5px; color: #94a3b8; line-height: 1.5;">
        <div id="streamTimeBadge" style="font-family: monospace; font-weight: 700; color: #38bdf8; margin-bottom: 4px;">Started: 10 Sept 2026, 04:06 PM</div>
        <p id="streamDesc" style="margin: 0;">Institutional academic live broadcast stream.</p>
      </div>

    </div>

  </main>

  <script src="js/api.js"></script>
  <script>
    let viewerPeer = null;
    let liveCall = null;

    window.addEventListener('DOMContentLoaded', async () => {
      await portalAPI.syncCatalog();
      const liveEvent = portalAPI.getLiveEvent();

      if (!liveEvent || !liveEvent.active || !liveEvent.peerId) {
        document.getElementById('streamLoadingState').innerHTML = `
          <span style="font-size: 32px; display: block; margin-bottom: 8px;">📡</span>
          <span style="font-size: 14px; font-weight: 700; color: #fff;">No active broadcast at the moment.</span>
          <br><a href="index.html" class="card-cta-btn" style="width: auto; margin-top: 10px; padding: 6px 14px;">Return Home</a>
        `;
        document.getElementById('streamTitle').textContent = "Stream Offline";
        return;
      }

      document.getElementById('streamTitle').textContent = liveEvent.title || "GEC Munger Official Live Academic Briefing";
      document.getElementById('streamDesc').textContent = liveEvent.description || "Live session by administration.";
      document.getElementById('streamTimeBadge').textContent = `Started: ${PortalAPI.formatTimestamp(liveEvent.startTime)}`;

      connectToBroadcast(liveEvent.peerId);
      portalAPI.joinLive();
    });

    window.addEventListener('beforeunload', () => {
      portalAPI.leaveLive();
      if (viewerPeer) viewerPeer.destroy();
    });

    function connectToBroadcast(hostPeerId) {
      const video = document.getElementById('liveVideoPlayer');
      const loader = document.getElementById('streamLoadingState');
      const viewerId = "gecm_thtr_" + Math.random().toString(36).substring(2, 8);

      viewerPeer = new Peer(viewerId, { debug: 1 });

      viewerPeer.on('open', () => {
        const dummyCanvas = document.createElement('canvas');
        dummyCanvas.width = 16;
        dummyCanvas.height = 16;
        const dummyStream = dummyCanvas.captureStream(1);

        liveCall = viewerPeer.call(hostPeerId, dummyStream);

        liveCall.on('stream', (remoteStream) => {
          loader.style.display = 'none';
          video.srcObject = remoteStream;
          video.muted = true;
          video.play().catch(() => {});
        });

        liveCall.on('close', () => {
          alert("The administrator has ended this live broadcast.");
          window.location.href = "index.html";
        });

        liveCall.on('error', () => {
          loader.innerHTML = `<span style="color: #ef4444; font-weight: 600;">Unable to connect to host.</span>`;
        });
      });

      document.getElementById('btnUnmuteAudio').addEventListener('click', function() {
        if (video) {
          video.muted = !video.muted;
          this.textContent = video.muted ? "🔊 Unmute Audio" : "🔇 Mute Audio";
        }
      });

      document.getElementById('btnFullscreen').addEventListener('click', () => {
        if (!document.fullscreenElement) {
          document.getElementById('videoViewport').requestFullscreen().catch(() => {});
        } else {
          document.exitFullscreen().catch(() => {});
        }
      });
    }
  </script>
</body>
</html>
