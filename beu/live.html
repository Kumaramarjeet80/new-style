<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Broadcast Theater - GEC Munger</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- PeerJS Client Library -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <link rel="stylesheet" href="css/theme.css">

  <style>
    .theater-container { max-width: 720px; margin: 0 auto; padding: 20px 16px 60px 16px; }
    .live-theater-card {
      background: var(--bg-secondary); border: 1px solid var(--border-subtle);
      border-radius: var(--card-radius); padding: 16px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }
    .video-viewport {
      width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 12px;
      overflow: hidden; position: relative; display: flex; align-items: center; justify-content: center; margin-bottom: 14px;
    }
    .video-viewport video { width: 100%; height: 100%; object-fit: contain; }
    .theater-controls-row { display: flex; gap: 12px; margin-bottom: 14px; }
    .theater-btn {
      flex: 1; background: rgba(255, 255, 255, 0.06); border: 1px solid var(--border-subtle);
      color: #fff; padding: 10px; border-radius: 10px; font-size: 13px; font-weight: 700;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: background 0.2s;
    }
    .theater-btn:hover { background: rgba(255, 255, 255, 0.12); }
    .fullscreen-exit-overlay {
      position: absolute; top: 16px; right: 16px; background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.2); color: #fff; padding: 8px 14px;
      border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; display: none;
      align-items: center; gap: 6px; z-index: 999; backdrop-filter: blur(4px);
    }
    .transition-spinner {
      width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #38bdf8; border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <!-- Top Navigation Bar -->
  <header class="portal-navbar">
    <a href="index.html" class="portal-brand"><span>GECM</span> Live Theater</a>
    <a href="index.html" class="btn-back-to-catalog" style="padding: 6px 12px; font-size: 11.5px;">← Back to Catalog</a>
  </header>

  <main class="theater-container">
    <div class="live-theater-card">
      
      <h1 id="streamTitle" style="font-size: 20px; font-weight: 800; color: #fff; margin: 0 0 14px 0;">Connecting to Live Session...</h1>

      <!-- Broadcast Viewport -->
      <div class="video-viewport" id="videoViewport">
        <!-- Proven video & dedicated audio elements for reliable audio/video rendering -->
        <video id="remoteVideo" autoplay playsinline></video>
        <audio id="remoteAudio" autoplay></audio>

        <button type="button" id="btnExitFullscreenOverlay" class="fullscreen-exit-overlay">
          ✕ Exit Fullscreen
        </button>

        <!-- Loading / Transition / Waiting State Overlay -->
        <div id="streamLoadingState" style="position: absolute; display: flex; flex-direction: column; align-items: center; gap: 12px; color: #94a3b8; text-align: center; padding: 20px; background: rgba(0,0,0,0.85); width: 100%; height: 100%; z-index: 10;">
          <div class="transition-spinner"></div>
          <span id="loadingMessageText" style="font-size: 13.5px; font-weight: 600; color: #fff;">Just wait for a moment, live is going to start shortly...</span>
        </div>

        <div id="liveBadgeTag" style="position: absolute; top: 12px; left: 12px; background: rgba(239, 68, 68, 0.9); color: #fff; font-size: 10.5px; font-weight: 800; padding: 3px 8px; border-radius: 6px; display: flex; align-items: center; gap: 5px; text-transform: uppercase; display: none;">
          <span class="live-pulse-dot" style="background-color: #fff; box-shadow: 0 0 6px #fff;"></span> LIVE
        </div>
      </div>

      <!-- Controls Row -->
      <div class="theater-controls-row">
        <button id="btnUnmuteAudio" type="button" class="theater-btn">🔊 Unmute Audio</button>
        <button id="btnFullscreen" type="button" class="theater-btn">⛶ Fullscreen</button>
      </div>

      <div style="font-size: 12.5px; color: #94a3b8; line-height: 1.5;">
        <div id="streamTimeBadge" style="font-family: monospace; font-weight: 700; color: #38bdf8; margin-bottom: 4px;">Status: Standby</div>
        <p id="streamDesc" style="margin: 0 0 6px 0;">Institutional academic live broadcast stream.</p>
        <div id="audioStatusIndicator" style="font-size: 11px; font-family: monospace; color: #f59e0b;">Audio Status: Waiting for connection...</div>
      </div>

    </div>
  </main>

  <script src="js/api.js"></script>
  <script>
    const FRESH_STREAM_KEY = "temple-hd-live-stream-v3-2026"; 

    let peer = null;
    let activeStream = null;

    window.addEventListener('DOMContentLoaded', async () => {
      await portalAPI.syncCatalog();
      const liveEvent = portalAPI.getLiveEvent();

      if (!liveEvent || !liveEvent.active) {
        document.getElementById('streamLoadingState').innerHTML = `
          <span style="font-size: 32px; display: block; margin-bottom: 8px;">⏳</span>
          <span style="font-size: 14px; font-weight: 700; color: #fff;">Just wait for a moment, live is going to start shortly.</span>
          <p style="font-size: 12px; color: #94a3b8; margin-top: 6px;">The administration will commence the transmission momentarily.</p>
          <br><a href="index.html" class="card-cta-btn" style="width: auto; margin-top: 4px; padding: 6px 14px;">Return Home</a>
        `;
        document.getElementById('streamTitle').textContent = "Stream Standby / Scheduled";
        return;
      }

      document.getElementById('streamTitle').textContent = liveEvent.title || "GEC Munger Official Live Academic Briefing";
      document.getElementById('streamDesc').textContent = liveEvent.description || "Live session by administration.";
      document.getElementById('streamTimeBadge').textContent = `Started: ${PortalAPI.formatTimestamp(liveEvent.startTime)}`;

      startViewerStream();
      portalAPI.joinLive();
    });

    window.addEventListener('beforeunload', () => {
      portalAPI.leaveLive();
      if (peer) peer.destroy();
    });

    function startViewerStream() {
      const videoElement = document.getElementById('remoteVideo');
      const audioElement = document.getElementById('remoteAudio');
      const loader = document.getElementById('streamLoadingState');
      const liveBadge = document.getElementById('liveBadgeTag');
      const audioStatus = document.getElementById('audioStatusIndicator');

      if (peer) { peer.destroy(); }

      peer = new Peer({
        config: {
          iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' },
            { urls: 'stun:stun2.l.google.com:19302' },
            { urls: 'stun:stun3.l.google.com:19302' },
            { urls: 'stun:stun4.l.google.com:19302' },
            { urls: 'stun:stun.services.mozilla.com' }
          ]
        }
      });

      peer.on('open', (myViewerId) => {
        const conn = peer.connect(FRESH_STREAM_KEY);

        conn.on('open', () => {
          conn.send('REQUEST_STREAM');
        });

        conn.on('error', () => {
          loader.style.display = 'flex';
          document.getElementById('loadingMessageText').textContent = "Reconnecting stream feed...";
        });

        peer.on('call', (call) => {
          call.answer();
          
          call.on('stream', (remoteStream) => {
            if (activeStream && activeStream !== remoteStream) {
              loader.style.display = 'flex';
              document.getElementById('loadingMessageText').textContent = "Switching source seamlessly...";
            }

            activeStream = remoteStream;

            videoElement.srcObject = remoteStream;
            audioElement.srcObject = remoteStream;

            videoElement.muted = true;
            audioElement.muted = true;

            videoElement.play().catch(e => console.log("Video autoplay wait:", e));
            audioElement.play().catch(e => console.log("Audio autoplay wait:", e));

            setTimeout(() => {
              loader.style.display = 'none';
              liveBadge.style.display = 'flex';
            }, 500);

            const audioTracks = remoteStream.getAudioTracks();
            if (audioTracks.length > 0) {
              audioStatus.textContent = `Audio Status: Connected (${audioTracks.length} track active)`;
              audioStatus.style.color = "#34d399";
            } else {
              audioStatus.textContent = "Audio Status: Warning - No audio track found";
              audioStatus.style.color = "#ef4444";
            }
          });
        });
      });

      // Unmute Audio Toggle
      document.getElementById('btnUnmuteAudio').addEventListener('click', function() {
        if (!videoElement || !audioElement) return;

        const willBeMuted = !videoElement.muted;
        videoElement.muted = willBeMuted;
        audioElement.muted = willBeMuted;

        if (activeStream) {
          activeStream.getAudioTracks().forEach(track => {
            track.enabled = !willBeMuted;
          });
        }

        if (!willBeMuted) {
          videoElement.play().catch(e => console.log(e));
          audioElement.play().catch(e => console.log(e));
          this.textContent = "🔇 Mute Audio";
          audioStatus.textContent = "Audio Status: UNMUTED & Playing Sound";
          audioStatus.style.color = "#38bdf8";
        } else {
          this.textContent = "🔊 Unmute Audio";
          audioStatus.textContent = "Audio Status: Muted by user";
          audioStatus.style.color = "#f59e0b";
        }
      });

      // Fullscreen Toggle Handlers
      const viewport = document.getElementById('videoViewport');
      const btnFullscreen = document.getElementById('btnFullscreen');
      const btnExitOverlay = document.getElementById('btnExitFullscreenOverlay');

      btnFullscreen.addEventListener('click', () => {
        if (!document.fullscreenElement) { viewport.requestFullscreen().catch(() => {}); }
        else { document.exitFullscreen().catch(() => {}); }
      });

      btnExitOverlay.addEventListener('click', () => {
        if (document.fullscreenElement) { document.exitFullscreen().catch(() => {}); }
      });

      document.addEventListener('fullscreenchange', () => {
        if (!document.fullscreenElement) {
          btnFullscreen.textContent = "⛶ Fullscreen";
          btnExitOverlay.style.display = 'none';
        } else {
          btnFullscreen.textContent = "⛶ Exit Fullscreen";
          btnExitOverlay.style.display = 'flex';
        }
      });
    }
  </script>
</body>
</html>
