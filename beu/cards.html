<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resource Cards - GEC Munger Academic Portal</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/theme.css">
</head>
<body>

  <!-- Top Navigation Bar -->
  <header class="portal-navbar">
    <a href="index.html" class="portal-brand">
      <span>GECM</span> Portal
    </a>
    <a href="admin.html" style="font-size: 12px; font-weight: 700; color: #94a3b8; text-decoration: none; padding: 6px 12px; border-radius: 6px; border: 1px solid #374151;">
      Admin Access
    </a>
  </header>

  <main class="portal-container">

    <!-- Breadcrumb Chain -->
    <nav class="breadcrumb-bar" id="breadcrumbNav">
      <a href="index.html" class="breadcrumb-item">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        Home
      </a>
      <span class="breadcrumb-separator">›</span>
      <a href="index.html" class="breadcrumb-item" id="bcCategoryLink">Category</a>
      <span class="breadcrumb-separator">›</span>
      <span class="breadcrumb-item active" id="bcSubcategoryTitle">Loading...</span>
    </nav>

    <!-- Header Section -->
    <section class="portal-header" style="text-align: left; margin-bottom: 28px;">
      <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 8px;">
        <span style="font-size: 28px;">📑</span>
        <h1 class="portal-title" id="subHeaderTitle" style="margin: 0; font-size: 26px;">Published Academic Resources</h1>
      </div>
      <p class="portal-subtitle" id="subHeaderDesc" style="margin: 0; max-width: 100%;">Select a document to read online or customize an official university cover sheet.</p>
    </section>

    <!-- Resource Cards Grid -->
    <section>
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px;">
        <h2 style="font-size: 16px; font-weight: 700; color: #fff; margin: 0;">Available Documents & Templates</h2>
        <span id="cardCountBadge" style="font-size: 12px; color: #94a3b8; font-family: monospace;">Loading...</span>
      </div>

      <div class="cards-grid" id="cardGrid">
        <div class="empty-state-card">
          <div class="spinner"></div>
          <span>Loading academic documents...</span>
        </div>
      </div>
    </section>

  </main>

  <script src="js/api.js"></script>
  <script>
    const targetSubId = PortalAPI.getQueryParam('sub');

    window.addEventListener('DOMContentLoaded', () => {
      if (!targetSubId) {
        window.location.href = "index.html";
        return;
      }

      renderResourceCards();

      // Listen for background updates
      portalAPI.onUpdate(() => {
        renderResourceCards();
      });

      portalAPI.syncCatalog();
    });

    function renderResourceCards() {
      const subcategory = portalAPI.getSubcategoryById(targetSubId);
      const cards = portalAPI.getCards(targetSubId);
      const grid = document.getElementById('cardGrid');
      const countBadge = document.getElementById('cardCountBadge');

      if (subcategory) {
        document.getElementById('bcSubcategoryTitle').textContent = subcategory.name;
        document.getElementById('subHeaderTitle').textContent = subcategory.name;
        document.getElementById('subHeaderDesc').textContent = subcategory.description || "Academic templates and documents.";

        const category = portalAPI.getCategoryById(subcategory.categoryId);
        const bcCatLink = document.getElementById('bcCategoryLink');
        if (category && bcCatLink) {
          bcCatLink.textContent = category.name;
          bcCatLink.href = `subcategories.html?cat=${encodeURIComponent(category.id)}`;
        }
      }

      if (!grid) return;
      grid.innerHTML = "";
      if (countBadge) countBadge.textContent = `${cards.length} Items`;

      if (cards.length === 0) {
        grid.innerHTML = `
          <div style="grid-column: 1/-1; text-align: center; color: #94a3b8; padding: 50px;">
            <span style="font-size: 32px; display: block; margin-bottom: 12px;">📄</span>
            No cards or templates registered under this subcategory yet.
            <br><a href="javascript:history.back()" class="btn-back-to-catalog" style="display: inline-flex; margin-top: 18px;">← Go Back</a>
          </div>`;
        return;
      }

      cards.forEach(cardData => {
        const cardEl = document.createElement('div');
        cardEl.className = "resource-card";

        const thumbHtml = cardData.thumbnailUrl
          ? `<img src="${cardData.thumbnailUrl}" class="card-thumbnail" alt="${cardData.title}">`
          : `<div class="card-thumbnail-placeholder">📄</div>`;

        const hasTarget = Boolean(cardData.targetUrl && String(cardData.targetUrl).trim().length > 5);
        const isDoc = (cardData.actionType === "link" || hasTarget);
        const defaultLabel = isDoc ? "View / Read Document" : "Customize Cover Page";
        const btnLabel = (cardData.buttonText && cardData.buttonText.trim().length > 0) ? cardData.buttonText : defaultLabel;

        const timeHtml = cardData.createdAt 
          ? `<div class="card-timestamp-badge" style="margin-bottom: 12px;">🕒 Published: ${cardData.createdAt}</div>`
          : ``;

        // Routing link: Link cards go to viewer.html; generator cards go to canvas.html
        const destinationUrl = (isDoc && hasTarget)
          ? `viewer.html?card=${encodeURIComponent(cardData.id)}`
          : `canvas.html?card=${encodeURIComponent(cardData.id)}`;

        cardEl.innerHTML = `
          <div class="card-thumbnail-wrap">
            ${thumbHtml}
          </div>
          <div class="card-body">
            <div class="card-title">${cardData.title}</div>
            <div class="card-desc">${cardData.description || "Academic resource ready for access."}</div>
            ${timeHtml}
            <a href="${destinationUrl}" class="card-cta-btn">${btnLabel}</a>
          </div>
        `;
        grid.appendChild(cardEl);
      });
    }
  </script>
</body>
</html>
