<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mohna Express - Sign In & Register</title>

  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="theme-retail">

<div class="app-container">
  
  <header class="app-header">
    <a href="index.html" class="brand-logo">
      <span>⚡</span> Mohna Express
    </a>
    <div class="header-right-actions">
      <div class="notif-bell-btn" onclick="openNotificationsModal()" title="Live Order Updates">
        🔔
        <span id="notifBadge" class="notif-badge-count" style="display:none;">0</span>
      </div>
      <div id="authHeaderContainer">
        <a href="profile.html" class="auth-pill auth-logged-out" id="headerAuthPill">
          🔑 Sign In
        </a>
      </div>
    </div>
  </header>

  <!-- AUTH VIEW -->
  <div id="authPageView" class="page-view active-page" style="max-width: 480px; margin: 40px auto;">
    <div class="card">
      <div style="display:flex; gap:6px; margin-bottom:14px;">
        <button class="auth-tab-btn active" id="btnTabLogin" onclick="toggleAuthTab('login')">Log In (Password)</button>
        <button class="auth-tab-btn" id="btnTabSignup" onclick="toggleAuthTab('signup')">Sign Up (OTP)</button>
      </div>

      <div id="loginView">
        <div class="form-group"><label>Email Address</label><input type="email" id="loginEmail" placeholder="name@gmail.com" /></div>
        <div class="form-group"><label>Password</label><input type="password" id="loginPassword" placeholder="••••••••" /></div>
        <div id="loginGpsStatus" style="font-size:12px; color:#2563eb; margin-bottom:12px; font-weight:bold;">📍 Detecting login GPS coordinates & address...</div>
        <button type="button" class="btn-submit" onclick="processUserPasswordLogin()">🔑 Log In</button>
      </div>

      <div id="signupStep1" style="display:none;">
        <div class="form-group"><label>Full Name</label><input type="text" id="signupName" placeholder="e.g. Rahul Kumar" /></div>
        <div class="form-group"><label>Mobile Number</label><input type="tel" id="signupPhone" placeholder="10-digit mobile" /></div>
        <div class="form-group"><label>Email Address</label><input type="email" id="signupEmail" placeholder="name@gmail.com" /></div>
        <div class="form-group"><label>Create Password</label><input type="password" id="signupPassword" placeholder="Minimum 6 characters" /></div>
        <div id="signupGpsStatus" style="font-size:12px; color:#2563eb; margin-bottom:12px; font-weight:bold;">📍 Locking registered GPS location & address...</div>
        <button type="button" class="btn-submit" id="btnRequestSignupOtp" onclick="requestSignupOtp()">Send Verification Code</button>
      </div>

      <div id="signupStep2" style="display:none;">
        <p style="font-size:13px; color:#475569; margin: 0 0 10px 0;">Enter 6-digit verification code sent to <b id="signupTargetEmail"></b></p>
        <div class="form-group"><input type="text" id="signupOtpCode" maxlength="6" style="text-align:center; font-size:22px; letter-spacing:4px;" placeholder="••••••" /></div>
        <button type="button" class="btn-submit" onclick="verifyAndCompleteSignup()">Verify & Create Account</button>
        <button type="button" style="background:none; border:none; color:#2563eb; font-size:12px; width:100%; text-align:center; margin-top:8px; cursor:pointer;" onclick="toggleSignupStep(1)">← Back / Resend Code</button>
      </div>

      <button type="button" style="background:none; border:none; color:#64748b; font-size:12px; width:100%; text-align:center; margin-top:14px; cursor:pointer;" onclick="window.location.href='index.html'">← Back to Home Store</button>
    </div>
  </div>

</div>

<!-- NOTIFICATIONS MODAL -->
<div id="notificationsModal" class="modal-overlay" style="display:none;">
  <div class="modal-card">
    <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #e2e8f0; padding-bottom:8px; margin-bottom:12px;">
      <h3 style="margin:0; color:#0f172a;">🔔 Live Order Notifications</h3>
      <button type="button" onclick="closeNotificationsModal()" style="background:none; border:none; font-size:18px; cursor:pointer; color:#64748b;">✕</button>
    </div>
    <div id="notificationsList">
      <p style="text-align:center; color:#94a3b8; font-size:13px;">No new dispatch notifications.</p>
    </div>
    <button type="button" class="btn-submit" style="background:#f1f5f9; color:#475569; border:1px solid #cbd5e1; margin-top:12px;" onclick="closeNotificationsModal()">Close</button>
  </div>
</div>

<!-- DYNAMIC MOHNA POPUP NOTIFICATION MODAL CONTAINER -->
<div id="mohnaPopupContainer"></div>

<!-- BOTTOM NAVIGATION -->
<nav class="bottom-nav">
  <a href="index.html" class="nav-item"><span>🏠</span> Home</a>
  <a href="checkout.html" class="nav-item">
    <div id="cartBadgeCount" class="cart-nav-badge" style="display:none;">0</div>
    <span>💳</span> Checkout
  </a>
  <a href="orders.html" class="nav-item"><span>📦</span> My Orders</a>
  <a href="profile.html" class="nav-item"><span>👤</span> Profile</a>
</nav>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="script.js"></script>
<script>
  window.addEventListener('DOMContentLoaded', () => {
    requestUserGPS();
  });
</script>
</body>
</html>
