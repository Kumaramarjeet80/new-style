<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloud Music App - Client & Admin Portal</title>
  <style>
    :root {
      --primary: #10b981;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 120px; }

    /* Navigation Bar */
    nav { background: #1e293b; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
    nav h2 { color: var(--primary); font-size: 1.3rem; }
    .nav-btns button { background: rgba(255,255,255,0.1); color: white; border: none; padding: 8px 16px; margin-left: 8px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .nav-btns button.active { background: var(--primary); }

    .container { max-width: 1100px; margin: 25px auto; padding: 0 15px; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
    .card-title { font-size: 1.1rem; font-weight: bold; color: var(--primary); margin-bottom: 15px; }

    /* Forms */
    .form-group { display: flex; flex-direction: column; margin-bottom: 12px; }
    label { font-size: 0.85rem; color: var(--muted); margin-bottom: 5px; font-weight: 600; }
    input[type="text"], input[type="password"], input[type="file"], select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: #0f172a; color: white; outline: none; }
    
    .btn { padding: 10px 18px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; background: var(--primary); color: white; }

    /* Song Lists */
    .song-list { list-style: none; max-height: 400px; overflow-y: auto; }
    .song-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid var(--border); cursor: pointer; transition: 0.2s; }
    .song-item:hover { background: rgba(255,255,255,0.05); }

    /* Bottom Player Bar */
    .player-bar {
      position: fixed; bottom: 0; left: 0; width: 100%;
      background: #020617; border-top: 1px solid var(--border);
      padding: 15px 30px; display: flex; justify-content: space-between; align-items: center;
      z-index: 1000;
    }
    .player-info { display: flex; align-items: center; gap: 15px; width: 250px; }
    .track-art { width: 45px; height: 45px; border-radius: 6px; background: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
    
    .player-controls { display: flex; flex-direction: column; align-items: center; gap: 8px; flex: 1; max-width: 500px; }
    .control-btns { display: flex; gap: 15px; align-items: center; }
    .btn-circle { width: 38px; height: 38px; border-radius: 50%; border: none; background: var(--primary); color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; }

    .progress-container { width: 100%; display: flex; align-items: center; gap: 10px; font-size: 0.8rem; color: var(--muted); }
    input[type="range"] { flex: 1; accent-color: var(--primary); cursor: pointer; }
  </style>
</head>
<body>

  <!-- Navigation -->
  <nav>
    <h2>🎧 Cloud Music Portal</h2>
    <div class="nav-btns">
      <button id="navClient" class="active" onclick="switchView('client')">🎵 Music Player</button>
      <button id="navAdmin" onclick="switchView('admin')">🔐 Admin Upload Portal</button>
    </div>
  </nav>

  <div class="container">
    
    <!-- CLIENT SIDE: MUSIC PLAYER -->
    <div id="viewClient">
      <div class="card">
        <div class="card-title">Live Song Library (Auto-Synced with Sheets)</div>
        <input type="text" id="searchBox" placeholder="🔍 Search song title or artist..." onkeyup="filterSongs()">
        <ul class="song-list" id="songLibrary">
          <li style="padding: 15px; text-align: center; color: var(--muted);">Loading songs from Google Drive & Sheets...</li>
        </ul>
      </div>
    </div>

    <!-- ADMIN SIDE: LOGIN & UPLOAD PORTAL -->
    <div id="viewAdminLogin" class="card" style="max-width: 400px; margin: 50px auto; display: none;">
      <div class="card-title">Admin Login</div>
      <form onsubmit="handleAdminLogin(event)">
        <div class="form-group"><label>Username</label><input type="text" id="adminUser" placeholder="admin" required></div>
        <div class="form-group"><label>Password</label><input type="password" id="adminPass" placeholder="admin123" required></div>
        <button type="submit" class="btn" style="width: 100%;">Login to Admin Portal</button>
      </form>
    </div>

    <div id="viewAdminDashboard" class="card" style="display: none;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <div class="card-title" style="margin: 0;">Upload MP3 Song to Google Drive</div>
        <button class="btn" style="background: #dc2626; padding: 4px 10px; font-size: 0.8rem;" onclick="logoutAdmin()">Logout</button>
      </div>

      <form id="uploadForm" onsubmit="handleSongUpload(event)">
        <div class="form-group"><label>Song Title</label><input type="text" id="songTitle" placeholder="e.g. Kesariya" required></div>
        <div class="form-group"><label>Artist Name</label><input type="text" id="songArtist" placeholder="e.g. Arijit Singh" required></div>
        <div class="form-group"><label>Cover Art Image URL (Optional)</label><input type="text" id="coverArtUrl" placeholder="https://..."></div>
        <div class="form-group"><label>Select MP3 File</label><input type="file" id="mp3FileInput" accept="audio/mp3, audio/mpeg" required></div>
        <button type="submit" id="uploadBtn" class="btn" style="width: 100%; margin-top: 10px;">☁️ Upload Song to Drive & Sync Sheet</button>
      </form>
    </div>

  </div>

  <!-- Audio Element -->
  <audio id="audioEngine" preload="metadata"></audio>

  <!-- FIXED BOTTOM PLAYER BAR -->
  <div class="player-bar">
    <div class="player-info">
      <div class="track-art">🎶</div>
      <div>
        <h4 id="playerTitle" style="font-size: 0.95rem;">No Song Playing</h4>
        <p id="playerArtist" style="font-size: 0.8rem; color: var(--muted);">Select a track to start</p>
      </div>
    </div>

    <div class="player-controls">
      <div class="control-btns">
        <button class="btn-circle" style="background:#334155" onclick="playPrev()">⏮️</button>
        <button class="btn-circle" id="playPauseBtn" onclick="togglePlayPause()">▶️</button>
        <button class="btn-circle" style="background:#334155" onclick="playNext()">⏭️</button>
      </div>

      <div class="progress-container">
        <span id="currentTime">0:00</span>
        <input type="range" id="progressBar" value="0" min="0" max="100" oninput="seekAudio()">
        <span id="durationTime">0:00</span>
      </div>
    </div>
  </div>

  <script>
    // PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL HERE
    const API_URL = "https://script.google.com/macros/s/AKfycbyC1VB0BnFkbAsSHSKFX3RrovyZufPybhiGfg8BKHi6nXlwxyaVAkUfU9lxOHHTnNlJBA/exec";

    let masterSongs = [];
    let currentTrackIndex = 0;
    let isPlaying = false;
    let isAdminLoggedIn = false;

    const audio = document.getElementById('audioEngine');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const progressBar = document.getElementById('progressBar');

    window.onload = function() {
      fetchSongsFromCloud();
    };

    function switchView(view) {
      document.getElementById('navClient').classList.remove('active');
      document.getElementById('navAdmin').classList.remove('active');

      document.getElementById('viewClient').style.display = 'none';
      document.getElementById('viewAdminLogin').style.display = 'none';
      document.getElementById('viewAdminDashboard').style.display = 'none';

      if (view === 'client') {
        document.getElementById('viewClient').style.display = 'block';
        document.getElementById('navClient').classList.add('active');
      } else {
        document.getElementById('navAdmin').classList.add('active');
        if (isAdminLoggedIn) {
          document.getElementById('viewAdminDashboard').style.display = 'block';
        } else {
          document.getElementById('viewAdminLogin').style.display = 'block';
        }
      }
    }

    function handleAdminLogin(e) {
      e.preventDefault();
      const user = document.getElementById('adminUser').value;
      const pass = document.getElementById('adminPass').value;

      if (user === "admin" && pass === "admin123") {
        isAdminLoggedIn = true;
        switchView('admin');
      } else {
        alert("Invalid Admin Credentials!");
      }
    }

    function logoutAdmin() {
      isAdminLoggedIn = false;
      switchView('admin');
    }

    // Fetch songs from Google Sheets via Apps Script API
    async function fetchSongsFromCloud() {
      try {
        const res = await fetch(`${API_URL}?action=getSongs`);
        const json = await res.json();
        if (json.status === "success") {
          masterSongs = json.songs;
          renderSongLibrary(masterSongs);
        }
      } catch (e) {
        document.getElementById('songLibrary').innerHTML = `<li style="padding: 15px; text-align: center; color: red;">Failed to load songs. Verify API URL.</li>`;
      }
    }

    function renderSongLibrary(songs) {
      const list = document.getElementById('songLibrary');
      list.innerHTML = '';

      if (songs.length === 0) {
        list.innerHTML = `<li style="padding: 15px; text-align: center; color: var(--muted);">No songs in library yet. Upload using Admin Portal.</li>`;
        return;
      }

      songs.forEach((song, idx) => {
        list.innerHTML += `
          <li class="song-item" onclick="playSongIndex(${idx})">
            <div>
              <h4>${song.title}</h4>
              <p style="font-size: 0.8rem; color: var(--muted);">${song.artist}</p>
            </div>
            <button class="btn" style="padding: 4px 10px; font-size: 0.75rem;">▶️ Play</button>
          </li>
        `;
      });
    }

    function filterSongs() {
      const q = document.getElementById('searchBox').value.toLowerCase();
      const filtered = masterSongs.filter(s => 
        s.title.toLowerCase().includes(q) || s.artist.toLowerCase().includes(q)
      );
      renderSongLibrary(filtered);
    }

    // Audio Playback
   function getDirectAudioUrl(url) {
  // Extract Google Drive File ID from any Drive URL
  const match = url.match(/[-\w]{25,}/);
  if (match) {
    // Use Google's high-speed CDN endpoint which bypasses audio player CORS restrictions
    return `https://lh3.googleusercontent.com/d/${match[0]}`;
  }
  return url;
}

function playSongIndex(idx) {
  currentTrackIndex = idx;
  const track = masterSongs[currentTrackIndex];
  
  // Convert Drive URL into a playable audio stream URL
  const playableUrl = getDirectAudioUrl(track.streamUrl || track.driveUrl);
  
  audio.src = playableUrl;

  document.getElementById('playerTitle').innerText = track.title;
  document.getElementById('playerArtist').innerText = track.artist;

  audio.play().then(() => {
    isPlaying = true;
    playPauseBtn.innerText = "⏸️";
    setupMediaSession(track);
  }).catch(err => {
    console.error("Playback error:", err);
    alert("Unable to stream this audio file. Please ensure the file in Google Drive has permissions set to 'Anyone with the link can view'.");
  });
}

    function togglePlayPause() {
      if (!audio.src) return;
      if (isPlaying) {
        audio.pause();
        playPauseBtn.innerText = "▶️";
      } else {
        audio.play();
        playPauseBtn.innerText = "⏸️";
      }
      isPlaying = !isPlaying;
    }

    function playNext() {
      if (masterSongs.length === 0) return;
      currentTrackIndex = (currentTrackIndex + 1) % masterSongs.length;
      playSongIndex(currentTrackIndex);
    }

    function playPrev() {
      if (masterSongs.length === 0) return;
      currentTrackIndex = (currentTrackIndex - 1 + masterSongs.length) % masterSongs.length;
      playSongIndex(currentTrackIndex);
    }

    // Media Session API for Lock Screen Playback & Background Play
    function setupMediaSession(track) {
      if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: track.title,
          artist: track.artist,
          album: "Cloud Music Library",
          artwork: [{ src: track.art, sizes: '150x150', type: 'image/png' }]
        });

        navigator.mediaSession.setActionHandler('play', () => togglePlayPause());
        navigator.mediaSession.setActionHandler('pause', () => togglePlayPause());
        navigator.mediaSession.setActionHandler('previoustrack', () => playPrev());
        navigator.mediaSession.setActionHandler('nexttrack', () => playNext());
      }
    }

    audio.ontimeupdate = function() {
      if (audio.duration) {
        progressBar.value = (audio.currentTime / audio.duration) * 100;
        document.getElementById('currentTime').innerText = formatTime(audio.currentTime);
        document.getElementById('durationTime').innerText = formatTime(audio.duration);
      }
    };

    audio.onended = function() { playNext(); };

    function seekAudio() {
      if (audio.duration) audio.currentTime = (progressBar.value / 100) * audio.duration;
    }

    function formatTime(s) {
      const m = Math.floor(s / 60); const sec = Math.floor(s % 60);
      return `${m}:${sec < 10 ? '0' : ''}${sec}`;
    }

    // Admin Upload Logic: Convert file to Base64 and send to Apps Script
    async function handleSongUpload(e) {
      e.preventDefault();
      const fileInput = document.getElementById('mp3FileInput');
      if (!fileInput.files[0]) return;

      const uploadBtn = document.getElementById('uploadBtn');
      uploadBtn.disabled = true;
      uploadBtn.innerText = "⏳ Uploading to Google Drive & Syncing Sheet...";

      const file = fileInput.files[0];
      const reader = new FileReader();

      reader.onload = async function() {
        const base64Data = reader.result.split(',')[1];
        
        const payload = {
          action: "uploadSong",
          title: document.getElementById('songTitle').value.trim(),
          artist: document.getElementById('songArtist').value.trim(),
          coverArt: document.getElementById('coverArtUrl').value.trim(),
          fileName: file.name,
          mimeType: file.type,
          fileData: base64Data
        };

        try {
          const res = await fetch(API_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });

          alert("🎉 Song uploaded successfully to Google Drive & added to Sheet!");
          document.getElementById('uploadForm').reset();
          fetchSongsFromCloud();
        } catch (err) {
          alert("Error uploading song: " + err.message);
        } finally {
          uploadBtn.disabled = false;
          uploadBtn.innerText = "☁️ Upload Song to Drive & Sync Sheet";
        }
      };

      reader.readAsDataURL(file);
    }
  </script>
</body>
</html>
