<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Our Private Space</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- PeerJS for WebRTC & Live Sync -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <!-- Canvas Confetti for Emoji Blast -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>

  <style>
    :root {
      --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --accent: #38bdf8;
    }
    body.her-theme {
      --bg: #fff1f2; --card: #ffe4e6; --text: #881337; --accent: #f43f5e;
    }
    body {
      margin: 0; font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh;
    }
    .header {
      padding: 10px 20px; display: flex; justify-content: space-between; align-items: center;
      background: var(--card); border-bottom: 1px solid rgba(0,0,0,0.1);
    }
    .status-badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; }
    .online { background: #22c55e; color: #fff; }
    .offline { background: #ef4444; color: #fff; }
    
    .main-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 15px; flex: 1; overflow: hidden;
    }
    @media (max-width: 768px) { .main-grid { grid-template-columns: 1fr; } }
    
    .panel {
      background: var(--card); border-radius: 12px; padding: 15px;
      display: flex; flex-direction: column; gap: 10px; overflow: hidden;
    }
    #video-container {
      display: none; position: relative; width: 100%; height: 200px; background: #000; border-radius: 8px;
    }
    video { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; }
    #chat-box { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .msg { padding: 8px 12px; border-radius: 8px; max-width: 75%; font-size: 14px; word-break: break-word; }
    .msg.me { align-self: flex-end; background: var(--accent); color: #fff; }
    .msg.them { align-self: flex-start; background: rgba(0,0,0,0.08); }
    
    .controls { display: flex; gap: 5px; flex-wrap: wrap; }
    input, button, select {
      padding: 8px 12px; border-radius: 6px; border: 1px solid rgba(0,0,0,0.2); outline: none;
    }
    button { background: var(--accent); color: white; border: none; cursor: pointer; }
    
    /* Pop-up */
    .modal {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6);
      justify-content: center; align-items: center; z-index: 1000;
    }
    .modal-box {
      background: #fff; color: #881337; padding: 25px; border-radius: 16px;
      text-align: center; max-width: 320px; box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }
    
    /* Toast Romantic Message */
    #romantic-toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: #f43f5e; color: #fff; padding: 10px 20px; border-radius: 30px;
      font-size: 13px; display: none; box-shadow: 0 4px 15px rgba(244,63,94,0.4); z-index: 999;
    }
  </style>
</head>
<body>

  <!-- Welcome Modal for Her -->
  <div id="welcomeModal" class="modal">
    <div class="modal-box">
      <h3 style="margin-top:0">🌸 Swagatam 🌸</h3>
      <p style="font-size: 18px; font-weight: 600;">"आइए देवी जी आइए, आपका ही इंतज़ार था"</p>
      <button onclick="closeModal()">Enter With Love ✨</button>
    </div>
  </div>

  <div id="romantic-toast"></div>

  <div class="header">
    <strong id="roleTitle">Private Portal</strong>
    <div>
      <span id="connStatus" class="status-badge offline">Connecting...</span>
      <button id="viewBtn" onclick="toggleCall()">📹 View Each Other</button>
      <button onclick="triggerEmojiBlast()">🎉 Blast Emoji</button>
    </div>
  </div>

  <div class="main-grid">
    <!-- Left Panel: Music & Live View -->
    <div class="panel">
      <div>
        <input type="text" id="ytUrl" placeholder="Paste YouTube link here..." style="width: calc(100% - 130px);">
        <button onclick="loadCustomVideo()">Load</button>
      </div>
      <div id="player" style="width: 100%; height: 220px; border-radius: 8px;"></div>
      <div class="controls">
        <button onclick="syncPlay()">▶ Play</button>
        <button onclick="syncPause()">⏸ Pause</button>
        <button onclick="syncTime()">🔄 Force Time Sync</button>
      </div>

      <!-- Live Video View -->
      <div id="video-container">
        <video id="remoteVideo" autoplay playsinline></video>
        <video id="localVideo" autoplay playsinline muted style="position: absolute; width: 70px; height: 50px; bottom: 5px; right: 5px; border: 1px solid white;"></video>
      </div>
      
      <!-- Extra Controls (For Him) -->
      <div id="himControls" style="display: none; border-top: 1px dashed rgba(255,255,255,0.2); padding-top: 8px;">
        <small style="display:block; margin-bottom: 5px;">👑 Special Controls:</small>
        <button onclick="startRecording()" id="recBtn">⏺ Record Call</button>
        <button onclick="stopRecording()" id="stopRecBtn" disabled>⏹ Stop & Save</button>
        <button onclick="exportChatAndMedia()">📁 Export Chat & Media</button>
      </div>
    </div>

    <!-- Right Panel: Chat & File Sharing -->
    <div class="panel">
      <div id="chat-box"></div>
      <div class="controls">
        <input type="text" id="msgInput" placeholder="Type a message..." style="flex: 1;" onkeypress="if(event.key==='Enter') sendText()">
        <input type="file" id="fileInput" style="display: none;" onchange="handleFileUpload(this)">
        <button onclick="document.getElementById('fileInput').click()">📎</button>
        <button onclick="sendText()">Send</button>
      </div>
    </div>
  </div>

  <script>
    // Configuration
    const GAS_ENDPOINT = "https://script.google.com/macros/s/AKfycbwbwht_UJ7HILYR6aSzjMaEgdAqCr8oBB45e65NanoGRuyoGlWSHcAKgo94YF632hY9kg/exec"; // Enter your Apps Script Web App URL
    const urlParams = new URLSearchParams(window.location.search);
    const myRole = urlParams.get('user') === 'her' ? 'her' : 'him';
    const peerRole = myRole === 'her' ? 'him' : 'her';

    const romanticQuotes = [
      "You make every day feel brighter just by being in it.",
      "I’ve never met someone who understands me the way you do.",
      "You have the kind of smile that makes my heart skip a beat.",
      "You’re not just beautiful — you’re unforgettable.",
      "I feel lucky every single time I get to talk to you.",
      "You make ordinary moments feel so special.",
      "Your laugh is easily my favorite sound in the world.",
      "You have a way of making everything feel safe and warm.",
      "You’re dangerously good at stealing my attention.",
      "How do you manage to look amazing without even trying?",
      "You’re like my favorite song — I never want you out of my head.",
      "You’re the reason I check my phone with a smile every time.",
      "You make even simple conversations feel like an adventure.",
      "I think you might be my absolute favorite view.",
      "You make my heart race without even saying a single word.",
      "You make me want to be the best version of myself.",
      "You’ve become my safe place in this busy world.",
      "Your eyes are like a whole universe I could get lost in.",
      "You’re effortlessly gorgeous, inside and out.",
      "I love how we can talk for hours and never run out of things to say."
    ];

    // Theme & UI Setup
    if (myRole === 'her') {
      document.body.classList.add('her-theme');
      document.getElementById('welcomeModal').style.display = 'flex';
      startRomanticMessages();
    } else {
      document.getElementById('himControls').style.display = 'block';
    }
    document.getElementById('roleTitle').innerText = myRole === 'her' ? "Queen's Space 👑" : "My Space 🎧";

    function closeModal() { document.getElementById('welcomeModal').style.display = 'none'; }

    // PeerJS Connection
    const peer = new Peer(`secret-room-2026-${myRole}`);
    let conn = null, callObj = null, localStream = null, mediaRecorder = null, recordedChunks = [];

    peer.on('open', () => tryConnect());
    peer.on('connection', (c) => {
      conn = c;
      setupDataListeners();
      updateStatus(true);
    });

    peer.on('call', (call) => {
      navigator.mediaDevices.getUserMedia({ video: true, audio: true }).then((stream) => {
        localStream = stream;
        document.getElementById('localVideo').srcObject = stream;
        document.getElementById('video-container').style.display = 'block';
        call.answer(stream);
        call.on('stream', (remoteStream) => {
          document.getElementById('remoteVideo').srcObject = remoteStream;
        });
        callObj = call;
      });
    });

    function tryConnect() {
      conn = peer.connect(`secret-room-2026-${peerRole}`);
      conn.on('open', () => {
        updateStatus(true);
        setupDataListeners();
      });
      conn.on('close', () => updateStatus(false));
      setTimeout(() => { if (!conn || !conn.open) tryConnect(); }, 4000);
    }

    function updateStatus(isOnline) {
      const el = document.getElementById('connStatus');
      el.className = `status-badge ${isOnline ? 'online' : 'offline'}`;
      el.innerText = isOnline ? 'Connected 💖' : 'Waiting...';
    }

    // YouTube Sync Engine
    let player;
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        height: '100%', width: '100%', videoId: 'dQw4w9WgXcQ',
        events: { 'onStateChange': onPlayerStateChange }
      });
    }

    let isRemoteAction = false;
    function onPlayerStateChange(event) {
      if (isRemoteAction) return;
      if (event.data === YT.PlayerState.PLAYING) {
        sendSignal({ type: 'YT_PLAY', time: player.getCurrentTime() });
      } else if (event.data === YT.PlayerState.PAUSED) {
        sendSignal({ type: 'YT_PAUSE', time: player.getCurrentTime() });
      }
    }

    function syncPlay() { player.playVideo(); sendSignal({ type: 'YT_PLAY', time: player.getCurrentTime() }); }
    function syncPause() { player.pauseVideo(); sendSignal({ type: 'YT_PAUSE', time: player.getCurrentTime() }); }
    function syncTime() { sendSignal({ type: 'YT_SEEK', time: player.getCurrentTime() }); }

    function loadCustomVideo() {
      const url = document.getElementById('ytUrl').value;
      const match = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/);
      if (match && match[1]) {
        player.loadVideoById(match[1]);
        sendSignal({ type: 'YT_LOAD', id: match[1] });
      }
    }

    // Messaging & WebRTC Data
    function setupDataListeners() {
      conn.on('data', (data) => {
        if (data.type === 'CHAT') renderMessage(data.payload, 'them');
        if (data.type === 'BLAST') confetti({ particleCount: 70, spread: 80, origin: { y: 0.6 } });
        
        isRemoteAction = true;
        if (data.type === 'YT_PLAY') { player.seekTo(data.time, true); player.playVideo(); }
        if (data.type === 'YT_PAUSE') { player.seekTo(data.time, true); player.pauseVideo(); }
        if (data.type === 'YT_SEEK') { player.seekTo(data.time, true); }
        if (data.type === 'YT_LOAD') { player.loadVideoById(data.id); }
        setTimeout(() => { isRemoteAction = false; }, 500);
      });
    }

    function sendSignal(obj) { if (conn && conn.open) conn.send(obj); }

    function sendText() {
      const input = document.getElementById('msgInput');
      const text = input.value.trim();
      if (!text) return;
      const payload = { sender: myRole, text: text, time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) };
      renderMessage(payload, 'me');
      saveLocal(payload);
      sendSignal({ type: 'CHAT', payload: payload });
      input.value = '';
    }

    function renderMessage(data, side) {
      const box = document.getElementById('chat-box');
      const div = document.createElement('div');
      div.className = `msg ${side}`;
      div.innerHTML = data.fileUrl 
        ? `<a href="${data.fileUrl}" target="_blank" style="color:inherit">📎 ${data.fileName}</a><div style="font-size:10px; opacity:0.7">${data.time}</div>`
        : `<div>${data.text}</div><div style="font-size:10px; opacity:0.7">${data.time}</div>`;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    function saveLocal(data) {
      let logs = JSON.parse(localStorage.getItem('private_chat') || '[]');
      logs.push(data);
      localStorage.setItem('private_chat', JSON.stringify(logs));
    }

    // File Upload via Base64 to Google Apps Script
    function handleFileUpload(input) {
      const file = input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        fetch(GAS_ENDPOINT, {
          method: 'POST',
          body: JSON.stringify({ sender: myRole, fileName: file.name, mimeType: file.type, base64Data: e.target.result })
        })
        .then(r => r.json())
        .then(res => {
          const payload = { sender: myRole, fileName: file.name, fileUrl: res.fileUrl, time: new Date().toLocaleTimeString() };
          renderMessage(payload, 'me');
          saveLocal(payload);
          sendSignal({ type: 'CHAT', payload: payload });
        });
      };
      reader.readAsDataURL(file);
    }

    // Video Calling ("View Each Other")
    function toggleCall() {
      const vContainer = document.getElementById('video-container');
      if (vContainer.style.display === 'block') {
        vContainer.style.display = 'none';
        if (localStream) localStream.getTracks().forEach(t => t.stop());
        if (callObj) callObj.close();
      } else {
        navigator.mediaDevices.getUserMedia({ video: true, audio: true }).then((stream) => {
          localStream = stream;
          document.getElementById('localVideo').srcObject = stream;
          vContainer.style.display = 'block';
          callObj = peer.call(`secret-room-2026-${peerRole}`, stream);
          callObj.on('stream', (remStream) => {
            document.getElementById('remoteVideo').srcObject = remStream;
          });
        });
      }
    }

    // Romantic Quote Automation (Every 60 Seconds)
    function startRomanticMessages() {
      let idx = 0;
      setInterval(() => {
        const toast = document.getElementById('romantic-toast');
        toast.innerText = romanticQuotes[idx % romanticQuotes.length];
        toast.style.display = 'block';
        setTimeout(() => toast.style.display = 'none', 8000);
        idx++;
      }, 60000);
    }

    // Emoji Blast
    function triggerEmojiBlast() {
      confetti({ particleCount: 80, spread: 100, origin: { y: 0.6 } });
      sendSignal({ type: 'BLAST' });
    }

    // Recording & Chat Export (Exclusive to 'him')
    function startRecording() {
      const stream = document.getElementById('remoteVideo').srcObject;
      if (!stream) return alert('No live video stream to record!');
      recordedChunks = [];
      mediaRecorder = new MediaRecorder(stream);
      mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: 'video/webm' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `call_recording_${Date.now()}.webm`;
        a.click();
      };
      mediaRecorder.start();
      document.getElementById('recBtn').disabled = true;
      document.getElementById('stopRecBtn').disabled = false;
    }

    function stopRecording() {
      mediaRecorder.stop();
      document.getElementById('recBtn').disabled = false;
      document.getElementById('stopRecBtn').disabled = true;
    }

    function exportChatAndMedia() {
      const logs = localStorage.getItem('private_chat') || '[]';
      const blob = new Blob([logs], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `chat_and_media_backup_${Date.now()}.json`;
      a.click();
    }

    // Load Local Storage History on Start
    (function loadHistory() {
      const logs = JSON.parse(localStorage.getItem('private_chat') || '[]');
      logs.forEach(l => renderMessage(l, l.sender === myRole ? 'me' : 'them'));
    })();
  </script>
</body>
</html>
