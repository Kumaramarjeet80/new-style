<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>She Is Yours - Control</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #4a69bd;
      --accent: #e55039;
      --bg: #0c0d14;
      --panel: rgba(255, 255, 255, 0.06);
      --border: rgba(255, 255, 255, 0.15);
      --text: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Quicksand', sans-serif;
      background: radial-gradient(circle at top left, #1e272e, var(--bg));
      color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden;
    }
    header {
      padding: 12px 20px; display: flex; justify-content: space-between;
      align-items: center; border-bottom: 1px solid var(--border); background: rgba(0,0,0,0.4);
    }
    .main-grid {
      flex: 1; display: grid; grid-template-columns: 1.2fr 1fr;
      gap: 16px; padding: 16px; position: relative; overflow: hidden;
    }
    .panel {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 14px; display: flex; flex-direction: column; overflow: hidden;
    }
    .video-area { position: relative; height: 100%; display: flex; flex-direction: column; }
    .video-viewport {
      flex: 1; position: relative; background: #000; border-radius: 10px;
      overflow: hidden; display: flex; align-items: center; justify-content: center;
    }
    video { width: 100%; height: 100%; object-fit: cover; }
    .local-preview {
      position: absolute; bottom: 12px; right: 12px; width: 130px; height: 95px;
      border-radius: 8px; border: 2px solid var(--primary); overflow: hidden; z-index: 10;
    }
    .call-controls, .admin-controls {
      display: flex; gap: 6px; justify-content: center; padding: 8px;
      background: rgba(0,0,0,0.5); border-top: 1px solid var(--border); flex-wrap: wrap;
    }
    .ctrl-btn {
      padding: 7px 12px; background: rgba(255,255,255,0.08); border: 1px solid var(--border);
      color: #fff; border-radius: 18px; font-size: 0.8rem; cursor: pointer;
    }
    .ctrl-btn:hover { background: var(--primary); }
    .ctrl-btn.danger { background: var(--accent); }

    /* Floating Chat */
    #draggableChat {
      position: absolute; bottom: 20px; right: 20px; width: 330px; height: 380px;
      background: #151722; border: 1px solid var(--primary); border-radius: 12px;
      display: flex; flex-direction: column; z-index: 100;
    }
    .chat-header {
      padding: 8px 12px; background: rgba(74, 105, 189, 0.2);
      cursor: move; display: flex; justify-content: space-between;
    }
    .chat-messages { flex: 1; padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
    .msg { max-width: 80%; padding: 6px 10px; border-radius: 10px; font-size: 0.8rem; }
    .msg.me { align-self: flex-end; background: var(--primary); }
    .msg.her { align-self: flex-start; background: rgba(255,255,255,0.1); }
    .chat-input-bar { padding: 6px; display: flex; gap: 4px; border-top: 1px solid var(--border); }
    .chat-input-bar input[type="text"] {
      flex: 1; padding: 6px; border-radius: 6px; border: none; background: rgba(255,255,255,0.08); color: #fff;
    }
  </style>
</head>
<body>

  <header>
    <div><strong>She Is Yours</strong> (Command Central)</div>
    <div style="display: flex; gap: 10px; align-items: center;">
      <span id="peerStatus" style="font-size:0.85rem;">Status: Initializing...</span>
      <button class="ctrl-btn" onclick="connectPeer()">Connect to Her</button>
    </div>
  </header>

  <div class="main-grid">
    <!-- Media Stream Viewport -->
    <div class="panel video-area">
      <div class="video-viewport" id="videoContainer">
        <video id="remoteVideo" autoplay playsinline></video>
        <div class="local-preview">
          <video id="localVideo" autoplay playsinline muted></video>
        </div>
      </div>
      
      <!-- Stream & Camera Switch Controls -->
      <div class="call-controls">
        <button class="ctrl-btn" onclick="startCall(true, true)">📹 Direct Video Call</button>
        <button class="ctrl-btn" onclick="startCall(false, true)">📞 Audio Call</button>
        <button class="ctrl-btn" onclick="startViewEachOther()">👀 View Each Other (Mute)</button>
        <button class="ctrl-btn" onclick="toggleMic()" id="micBtn">🎤 Mic On/Off</button>
        <button class="ctrl-btn" onclick="flipCamera()">🔄 Flip Cam</button>
        <button class="ctrl-btn" onclick="shareScreen()">💻 Share Screen</button>
        <button class="ctrl-btn danger" onclick="endCall()">❌ End</button>
      </div>

      <!-- Admin Special Features Panel -->
      <div class="admin-controls">
        <button class="ctrl-btn" onclick="sendEmoji('❤️')">Send ❤️</button>
        <button class="ctrl-btn" onclick="sendEmoji('💋')">Send 💋</button>
        <button class="ctrl-btn" onclick="sendEmoji('💍')">Send 💍</button>
        <button class="ctrl-btn" id="recordBtn" onclick="toggleRecording()">⏺ Record Call</button>
        <button class="ctrl-btn" onclick="exportChatLog()">💾 Export Chat</button>
      </div>
    </div>

    <!-- Synchronized YouTube Player -->
    <div class="panel" style="padding: 12px;">
      <h4 style="margin-bottom: 8px;">Synchronized Music Hub</h4>
      <div style="display: flex; gap: 6px; margin-bottom: 8px;">
        <input type="text" id="ytUrl" style="flex:1; padding:6px; border-radius:6px; background:#000; border:1px solid var(--border); color:#fff;" placeholder="YouTube Video URL" />
        <button class="ctrl-btn" onclick="loadYouTubeVideo()">Load</button>
        <button class="ctrl-btn" onclick="syncPlayPause()">⏯ Sync Play/Pause</button>
      </div>
      <div style="flex:1; border-radius: 8px; overflow: hidden; background:#000;">
        <div id="player"></div>
      </div>
    </div>
  </div>

  <!-- Draggable Chat -->
  <div id="draggableChat">
    <div class="chat-header" id="chatDragHeader">
      <span>Private Encrypted Link</span>
      <button onclick="clearChat()" style="background:none; border:none; color:#bbb; cursor:pointer; font-size:0.75rem;">Clear</button>
    </div>
    <div class="chat-messages" id="chatMsgs"></div>
    <div class="chat-input-bar">
      <input type="file" id="fileInput" style="display:none;" onchange="handleFileSend(this)" />
      <button class="ctrl-btn" onclick="document.getElementById('fileInput').click()">📎</button>
      <input type="text" id="chatTxt" placeholder="Message..." onkeydown="if(event.key==='Enter') sendText()" />
      <button class="ctrl-btn" onclick="sendText()">Send</button>
    </div>
  </div>

  <script>
    const MY_ID = "him_private_id";
    const TARGET_ID = "her_private_id";
    let peer, conn, activeCall, localStream, ytPlayer;
    let mediaRecorder, recordedChunks = [];
    let isRecording = false, usingFrontCamera = true;

    function initPeer() {
      peer = new Peer(MY_ID);
      peer.on('open', () => {
        document.getElementById('peerStatus').innerText = "Status: Online (Waiting/Ready)";
        connectPeer();
      });
      peer.on('connection', (c) => { conn = c; setupDataHandlers(); });
      peer.on('call', (call) => {
        activeCall = call;
        navigator.mediaDevices.getUserMedia({ video: true, audio: true }).then((stream) => {
          localStream = stream;
          document.getElementById('localVideo').srcObject = stream;
          call.answer(stream);
          call.on('stream', (remStream) => { document.getElementById('remoteVideo').srcObject = remStream; });
        });
      });
    }

    function connectPeer() {
      conn = peer.connect(TARGET_ID);
      conn.on('open', () => {
        document.getElementById('peerStatus').innerText = "Status: Connected to Her ❤️";
        setupDataHandlers();
      });
    }

    function setupDataHandlers() {
      conn.on('data', (data) => {
        if (data.type === 'chat') renderChatMessage(data.sender, data.text);
        if (data.type === 'file') renderFileMessage(data.sender, data.filename, data.fileData);
        if (data.type === 'yt_load') ytPlayer.loadVideoById(data.videoId);
        if (data.type === 'yt_state') handleRemotePlayerState(data.state, data.time);
      });
    }

    async function startCall(videoOpt, audioOpt) {
      localStream = await navigator.mediaDevices.getUserMedia({ video: videoOpt, audio: audioOpt });
      document.getElementById('localVideo').srcObject = localStream;
      const call = peer.call(TARGET_ID, localStream);
      activeCall = call;
      call.on('stream', (remoteStream) => {
        document.getElementById('remoteVideo').srcObject = remoteStream;
      });
    }

    function startViewEachOther() { startCall(true, false); }

    function toggleMic() {
      if (localStream) {
        const audioTracks = localStream.getAudioTracks();
        if (audioTracks.length > 0) {
          audioTracks[0].enabled = !audioTracks[0].enabled;
          document.getElementById('micBtn').innerText = audioTracks[0].enabled ? "🎤 Mic On" : "🔇 Mic Off";
        }
      }
    }

    async function flipCamera() {
      usingFrontCamera = !usingFrontCamera;
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: usingFrontCamera ? "user" : "environment" },
        audio: true
      });
      replaceStreamTracks(stream);
    }

    async function shareScreen() {
      const screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
      replaceStreamTracks(screenStream);
    }

    function replaceStreamTracks(newStream) {
      if (activeCall && activeCall.peerConnection) {
        const sender = activeCall.peerConnection.getSenders().find(s => s.track.kind === 'video');
        if (sender) sender.replaceTrack(newStream.getVideoTracks()[0]);
      }
      localStream = newStream;
      document.getElementById('localVideo').srcObject = newStream;
    }

    function endCall() {
      if (activeCall) activeCall.close();
      if (localStream) localStream.getTracks().forEach(track => track.stop());
      document.getElementById('localVideo').srcObject = null;
      document.getElementById('remoteVideo').srcObject = null;
    }

    // Chat Mechanics
    function sendText() {
      const txt = document.getElementById('chatTxt').value;
      if (!txt) return;
      renderChatMessage('me', txt);
      if (conn) conn.send({ type: 'chat', sender: 'him', text: txt });
      saveChatLocally('Him', txt);
      document.getElementById('chatTxt').value = '';
    }

    function renderChatMessage(sender, text) {
      const box = document.getElementById('chatMsgs');
      const msg = document.createElement('div');
      msg.className = `msg ${sender === 'me' || sender === 'him' ? 'me' : 'her'}`;
      msg.innerText = text;
      box.appendChild(msg);
      box.scrollTop = box.scrollHeight;
    }

    function handleFileSend(input) {
      const file = input.files[0];
      const reader = new FileReader();
      reader.onload = function(e) {
        renderFileMessage('me', file.name, e.target.result);
        if (conn) conn.send({ type: 'file', sender: 'him', filename: file.name, fileData: e.target.result });
      };
      reader.readAsDataURL(file);
    }

    function renderFileMessage(sender, name, dataUrl) {
      const box = document.getElementById('chatMsgs');
      const msg = document.createElement('div');
      msg.className = `msg ${sender === 'me' ? 'me' : 'her'}`;
      msg.innerHTML = `📄 <a href="${dataUrl}" download="${name}" style="color:#fff; text-decoration:underline;">${name}</a>`;
      box.appendChild(msg);
    }

    function saveChatLocally(sender, text) {
      let history = JSON.parse(localStorage.getItem('couple_chat') || '[]');
      history.push({ sender, text, time: new Date().toISOString() });
      localStorage.setItem('couple_chat', JSON.stringify(history));
    }

    function exportChatLog() {
      const history = localStorage.getItem('couple_chat') || '[]';
      const blob = new Blob([history], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `Our_Private_Chat_${Date.now()}.json`;
      a.click();
    }

    function clearChat() {
      localStorage.removeItem('couple_chat');
      document.getElementById('chatMsgs').innerHTML = '';
    }

    // Send Fullscreen Emoji to Her
    function sendEmoji(emoji) {
      if (conn) conn.send({ type: 'emoji', emoji: emoji });
    }

    // Video Recording Functionality
    function toggleRecording() {
      if (!isRecording) {
        const stream = document.getElementById('remoteVideo').srcObject;
        if (!stream) { alert("No active video call to record!"); return; }
        recordedChunks = [];
        mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
        mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
        mediaRecorder.onstop = promptSaveRecording;
        mediaRecorder.start();
        isRecording = true;
        document.getElementById('recordBtn').innerText = "⏹ Stop Recording";
      } else {
        mediaRecorder.stop();
        isRecording = false;
        document.getElementById('recordBtn').innerText = "⏺ Record Call";
      }
    }

    function promptSaveRecording() {
      const confirmSave = confirm("Do you want to download and save this recorded call?");
      if (confirmSave) {
        const blob = new Blob(recordedChunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `Our_Memory_Video_${Date.now()}.webm`;
        a.click();
      }
    }

    // YouTube Sync API
    function onYouTubeIframeAPIReady() {
      ytPlayer = new YT.Player('player', {
        height: '100%',
        width: '100%',
        videoId: 'dQw4w9WgXcQ',
        playerVars: { 'autoplay': 0, 'controls': 1 }
      });
    }

    function loadYouTubeVideo() {
      const url = document.getElementById('ytUrl').value;
      let videoId = url.split('v=')[1] || url;
      const ampersandPosition = videoId.indexOf('&');
      if (ampersandPosition !== -1) videoId = videoId.substring(0, ampersandPosition);
      ytPlayer.loadVideoById(videoId);
      if (conn) conn.send({ type: 'yt_load', videoId: videoId });
    }

    function syncPlayPause() {
      const state = ytPlayer.getPlayerState();
      const currentTime = ytPlayer.getCurrentTime();
      if (state === 1) {
        ytPlayer.pauseVideo();
        if (conn) conn.send({ type: 'yt_state', state: 'pause', time: currentTime });
      } else {
        ytPlayer.playVideo();
        if (conn) conn.send({ type: 'yt_state', state: 'play', time: currentTime });
      }
    }

    function handleRemotePlayerState(state, time) {
      if (Math.abs(ytPlayer.getCurrentTime() - time) > 1.5) ytPlayer.seekTo(time, true);
      if (state === 'play') ytPlayer.playVideo();
      if (state === 'pause') ytPlayer.pauseVideo();
    }

    // Chat Window Drag
    dragElement(document.getElementById("draggableChat"));
    function dragElement(elmnt) {
      var p1 = 0, p2 = 0, p3 = 0, p4 = 0;
      document.getElementById("chatDragHeader").onmousedown = (e) => {
        p3 = e.clientX; p4 = e.clientY;
        document.onmouseup = () => { document.onmouseup = null; document.onmousemove = null; };
        document.onmousemove = (ev) => {
          p1 = p3 - ev.clientX; p2 = p4 - ev.clientY;
          p3 = ev.clientX; p4 = ev.clientY;
          elmnt.style.top = (elmnt.offsetTop - p2) + "px";
          elmnt.style.left = (elmnt.offsetLeft - p1) + "px";
        };
      };
    }

    window.onload = initPeer;
  </script>
</body>
</html>
