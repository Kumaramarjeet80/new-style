<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yours Room</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { display: flex; height: 100vh; background: #0f172a; color: #f8fafc; }

    #left-panel { flex: 1.3; display: flex; flex-direction: column; border-right: 1px solid #334155; padding: 20px; gap: 15px; overflow-y: auto; }
    #right-panel { flex: 1; display: flex; flex-direction: column; background: #1e293b; }

    .card { background: #1e293b; padding: 15px; border-radius: 10px; border: 1px solid #334155; display: flex; flex-direction: column; gap: 10px; }
    .input-group { display: flex; gap: 8px; }
    input[type="text"] { flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; outline: none; }
    button { padding: 10px 16px; background: #3b82f6; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
    button:hover { background: #2563eb; }

    .status-badge { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #ef4444; }
    .dot.connected { background: #22c55e; box-shadow: 0 0 8px #22c55e; }

    .player-container { position: relative; width: 100%; height: 280px; background: #000; border-radius: 12px; overflow: hidden; }
    iframe#youtube-player { width: 100%; height: 100%; border: none; }
    #sync-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.95); display: flex; flex-direction: column;
      justify-content: center; align-items: center; z-index: 10; gap: 10px; text-align: center; padding: 20px;
    }

    #search-results { max-height: 180px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
    .search-item { display: flex; align-items: center; gap: 10px; background: #0f172a; padding: 8px; border-radius: 6px; cursor: pointer; }
    .search-item:hover { background: #334155; }
    .search-item img { width: 60px; height: 45px; border-radius: 4px; object-fit: cover; }
    .search-item-title { font-size: 13px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .chat-header { padding: 15px 20px; background: #0f172a; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
    #chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 75%; padding: 10px 14px; border-radius: 8px; font-size: 14px; line-height: 1.4; }
    .msg.mine { align-self: flex-end; background: #2563eb; color: white; }
    .msg.partner { align-self: flex-start; background: #334155; color: white; }
    .msg-meta { font-size: 10px; opacity: 0.7; margin-top: 4px; text-align: right; }
    .sys-msg { align-self: center; background: #475569; font-size: 12px; padding: 4px 10px; border-radius: 12px; color: #cbd5e1; }
    .chat-input-area { padding: 15px; background: #0f172a; display: flex; gap: 10px; border-top: 1px solid #334155; }
  </style>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

  <div id="left-panel">
    <h2>Yours Page</h2>

    <div class="card">
      <div class="status-badge">
        <div id="status-dot" class="dot"></div>
        <span id="status-text">Connecting to Mine...</span>
      </div>
    </div>

    <div class="player-container">
      <div id="sync-overlay">
        <h3>Sync Audio Permission</h3>
        <button onclick="unlockAudioSync()" style="background: #22c55e;">Enable Music Sync</button>
      </div>
      <div id="youtube-player"></div>
    </div>

    <div class="card">
      <label style="font-size: 12px; font-weight: bold; color: #94a3b8;">SEARCH & PLAY SONG</label>
      <div class="input-group">
        <input type="text" id="yt-search-query" placeholder="Search song or paste YouTube link..." onkeydown="if(event.key==='Enter') executeSearch()">
        <button onclick="executeSearch()">Search</button>
      </div>
      <div id="search-results"></div>
    </div>

    <div class="card" style="flex-direction: row;">
      <button onclick="togglePlayPause()" style="flex: 1;">Play / Pause</button>
    </div>
  </div>

  <div id="right-panel">
    <div class="chat-header">
      <h3>Chat with Mine</h3>
    </div>
    <div id="chat-messages"></div>
    <div class="chat-input-area">
      <input type="text" id="chat-input" placeholder="Type a message..." onkeydown="if(event.key==='Enter') sendChatMessage()">
      <button onclick="sendChatMessage()">Send</button>
    </div>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    const MY_ID = 'pair-room-yours-node-1234';
    const TARGET_ID = 'pair-room-mine-node-1234';

    let peer = new Peer(MY_ID);
    let conn = null;

    peer.on('open', () => {
      attemptConnection();
    });

    peer.on('connection', (incoming) => {
      conn = incoming;
      setupConnection();
    });

    function attemptConnection() {
      if (!conn || !conn.open) {
        conn = peer.connect(TARGET_ID);
        setupConnection();
      }
    }

    function setupConnection() {
      conn.on('open', () => {
        document.getElementById('status-text').innerText = "Connected to Mine!";
        document.getElementById('status-dot').classList.add('connected');
      });

      conn.on('data', (data) => {
        if (data.type === 'chat') renderMessageUI(data.text, 'partner', data.time);
        else if (data.type === 'music') handleRemoteMusic(data);
      });

      conn.on('close', () => {
        document.getElementById('status-text').innerText = "Reconnecting...";
        document.getElementById('status-dot').classList.remove('connected');
        setTimeout(attemptConnection, 3000);
      });
    }

    function sendChatMessage() {
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text) return;

      const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      renderMessageUI(text, 'mine', time);

      if (conn && conn.open) {
        conn.send({ type: 'chat', text: text, time: time });
      }
      input.value = '';
    }

    function renderMessageUI(text, sender, time) {
      const container = document.getElementById('chat-messages');
      const div = document.createElement('div');
      div.className = `msg ${sender}`;
      div.innerHTML = `<div>${text}</div><div class="msg-meta">${time}</div>`;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }

    // YouTube Integration
    let player;
    let isRemote = false;

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('youtube-player', {
        videoId: 'M7lc1UVf-VE',
        playerVars: { 'autoplay': 0, 'controls': 1 },
        events: { 'onStateChange': onPlayerStateChange }
      });
    }

    function unlockAudioSync() {
      document.getElementById('sync-overlay').style.display = 'none';
      if (player) { player.playVideo(); setTimeout(() => player.pauseVideo(), 200); }
    }

    function executeSearch() {
      const query = document.getElementById('yt-search-query').value.trim();
      if (!query) return;

      const reg = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = query.match(reg);
      const videoId = (match && match[2].length === 11) ? match[2] : (query.length === 11 ? query : null);

      if (videoId) {
        playSong(videoId);
      } else {
        fetch(`https://invidious.io.lol/api/v1/search?q=${encodeURIComponent(query)}&type=video`)
          .then(res => res.json())
          .then(data => {
            const container = document.getElementById('search-results');
            container.innerHTML = '';
            data.slice(0, 4).forEach(item => {
              const div = document.createElement('div');
              div.className = 'search-item';
              div.onclick = () => playSong(item.videoId);
              div.innerHTML = `<img src="${item.videoThumbnails ? item.videoThumbnails[0].url : ''}"><div class="search-item-title">${item.title}</div>`;
              container.appendChild(div);
            });
          });
      }
    }

    function playSong(videoId) {
      isRemote = true;
      player.loadVideoById(videoId, 0);
      if (conn && conn.open) conn.send({ type: 'music', action: 'load', videoId: videoId, time: 0 });
      document.getElementById('search-results').innerHTML = '';
      setTimeout(() => isRemote = false, 800);
    }

    function togglePlayPause() {
      const state = player.getPlayerState();
      const time = player.getCurrentTime();
      if (state === YT.PlayerState.PLAYING) {
        player.pauseVideo();
        if (conn && conn.open) conn.send({ type: 'music', action: 'pause', time: time });
      } else {
        player.playVideo();
        if (conn && conn.open) conn.send({ type: 'music', action: 'play', time: time });
      }
    }

    function onPlayerStateChange(event) {
      if (isRemote) return;
      const time = player.getCurrentTime();
      if (event.data === YT.PlayerState.PLAYING) {
        if (conn && conn.open) conn.send({ type: 'music', action: 'play', time: time });
      } else if (event.data === YT.PlayerState.PAUSED) {
        if (conn && conn.open) conn.send({ type: 'music', action: 'pause', time: time });
      }
    }

    function handleRemoteMusic(data) {
      isRemote = true;
      if (data.action === 'load') player.loadVideoById(data.videoId, data.time);
      else if (data.action === 'play') {
        if (Math.abs(player.getCurrentTime() - data.time) > 0.5) player.seekTo(data.time, true);
        player.playVideo();
      } else if (data.action === 'pause') {
        player.pauseVideo();
        player.seekTo(data.time, true);
      }
      setTimeout(() => isRemote = false, 800);
    }
  </script>
</body>
</html>
