<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Camera Broadcast Portal</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; background: #111; color: #fff; text-align: center; padding: 20px; }
    video { width: 100%; max-width: 600px; background: #000; border-radius: 8px; margin-top: 15px; }
    .btn { padding: 12px 24px; font-size: 16px; background: #28a745; color: white; border: none; font-weight: bold; cursor: pointer; border-radius: 5px; }
    #status { margin: 15px 0; font-weight: bold; color: #ffc107; }
    #viewers { margin-top: 10px; color: #17a2b8; font-weight: bold; }
  </style>
</head>
<body>

  <h1>📷 Camera Broadcast Portal</h1>
  <p id="status">Status: Camera Off</p>
  <p id="viewers">Connected Viewers: 0</p>

  <button id="startBtn" class="btn" onclick="startCamera()">Start Live Stream</button>
  <br>
  <video id="preview" autoplay playsinline muted></video>

  <script>
    const HOST_ID = "shree-temple-main-camera-2026"; 
    const preview = document.getElementById('preview');
    const statusText = document.getElementById('status');
    const viewersText = document.getElementById('viewers');

    let localStream = null;
    let peer = null;
    let connectedCalls = new Map();

    async function startCamera() {
      try {
        statusText.innerText = "Requesting camera access...";
        localStream = await navigator.mediaDevices.getUserMedia({ 
          video: { width: { ideal: 1280 }, height: { ideal: 720 } }, 
          audio: true 
        });

        preview.srcObject = localStream;

        peer = new Peer(HOST_ID, {
          config: {
            iceServers: [
              { urls: 'stun:stun.l.google.com:19302' },
              { urls: 'stun:stun1.l.google.com:19302' }
            ]
          }
        });

        peer.on('open', () => {
          statusText.innerText = "🔴 LIVE: Ready for visitors!";
          statusText.style.color = "#28a745";
          document.getElementById('startBtn').style.display = 'none';
        });

        // Listen for connection messages from incoming visitors
        peer.on('connection', (conn) => {
          conn.on('data', (data) => {
            if (data.type === 'JOIN' && localStream) {
              // Dial the visitor directly with the video stream
              const call = peer.call(data.viewerId, localStream);
              connectedCalls.set(data.viewerId, call);
              updateViewerCount();

              call.on('close', () => {
                connectedCalls.delete(data.viewerId);
                updateViewerCount();
              });
            }
          });
        });

        peer.on('error', (err) => {
          if (err.type === 'unavailable-id') {
            statusText.innerText = "Error: Stream active in another tab. Close other tabs and refresh.";
            statusText.style.color = "#dc3545";
          }
        });

      } catch (err) {
        statusText.innerText = "Camera permission denied or device error.";
        statusText.style.color = "#dc3545";
      }
    }

    function updateViewerCount() {
      viewersText.innerText = `Connected Viewers: ${connectedCalls.size}`;
    }
  </script>
</body>
</html>
