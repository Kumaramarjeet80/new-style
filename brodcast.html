<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Camera Operator Portal</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; background: #111; color: #fff; text-align: center; padding: 20px; }
    video { width: 100%; max-width: 600px; background: #000; border-radius: 8px; margin-top: 15px; }
    .btn { padding: 12px 24px; font-size: 16px; background: #28a745; color: white; border: none; font-weight: bold; cursor: pointer; border-radius: 5px; }
    #status { margin: 15px 0; font-weight: bold; color: #ffc107; }
  </style>
</head>
<body>

  <h1>📷 Camera Broadcast Portal</h1>
  <p id="status">Status: Camera Off</p>

  <button id="startBtn" class="btn" onclick="startCamera()">Start Live Stream</button>
  <br>
  <video id="preview" autoplay playsinline muted></video>

  <script>
    const STREAM_KEY = "shree-temple-main-camera-2026"; 
    const preview = document.getElementById('preview');
    const statusText = document.getElementById('status');

    async function startCamera() {
      try {
        statusText.innerText = "Requesting camera access...";
        const stream = await navigator.mediaDevices.getUserMedia({ 
          video: true, 
          audio: true 
        });

        preview.srcObject = stream;

        const peer = new Peer(STREAM_KEY, {
          config: {
            iceServers: [
              { urls: 'stun:stun.l.google.com:19302' },
              { urls: 'stun:stun1.l.google.com:19302' }
            ]
          }
        });

        peer.on('open', () => {
          statusText.innerText = "🔴 LIVE: Ready for visitors!";
          statusText.style.color = "#28a745";
          document.getElementById('startBtn').style.display = 'none';
        });

        peer.on('call', (call) => {
          call.answer(stream);
        });

        peer.on('error', (err) => {
          if (err.type === 'unavailable-id') {
            statusText.innerText = "Error: Key active in another window. Close other tabs and refresh.";
            statusText.style.color = "#dc3545";
          }
        });

      } catch (err) {
        statusText.innerText = "Camera permission denied or device error.";
        statusText.style.color = "#dc3545";
      }
    }
  </script>
</body>
</html>
