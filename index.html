<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shree Mandir - Live Darshan</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; background: #0f0f0f; color: #fff; text-align: center; margin: 0; padding: 20px; }
    header { margin-bottom: 20px; }
    .video-card { max-width: 900px; margin: 0 auto; background: #1a1a1a; padding: 15px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    video { width: 100%; height: auto; background: #000; border-radius: 8px; display: block; }
    .status-badge { display: inline-block; padding: 6px 16px; border-radius: 20px; font-weight: bold; margin-top: 15px; background: #333; }
    .online { background: #28a745; color: #fff; }
    .offline { background: #dc3545; color: #fff; }
    .btn { margin-top: 15px; padding: 10px 20px; background: #d4af37; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; color: #000; }
  </style>
</head>
<body>

  <header>
    <h1>🛕 Live Temple Darshan</h1>
    <div id="badge" class="status-badge">Connecting to live feed...</div>
  </header>

  <div class="video-card">
    <!-- muted and playsinline are required for browser autoplay policies -->
    <video id="remoteVideo" autoplay playsinline muted controls></video>
    <br>
    <button id="connectBtn" class="btn" onclick="connectToStream()">Tap to Load / Unmute Stream</button>
  </div>

  <script>
    // EXACT SAME KEY AS BROADCAST PAGE
    const STREAM_KEY = "shree-temple-main-camera-2026"; 

    const videoElement = document.getElementById('remoteVideo');
    const badge = document.getElementById('badge');
    let peer = null;

    function connectToStream() {
      badge.innerText = "Connecting to broadcaster...";
      badge.className = "status-badge";

      if (peer) { peer.destroy(); }

      // STUN configuration ensures connection across different Wi-Fi/Mobile networks
      peer = new Peer({
        config: {
          iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' }
          ]
        }
      });

      peer.on('open', () => {
        const call = peer.call(STREAM_KEY, null);

        call.on('stream', (remoteStream) => {
          badge.innerText = "🔴 LIVE DARSHAN";
          badge.className = "status-badge online";
          videoElement.srcObject = remoteStream;
          
          // Play video programmatically
          videoElement.play().catch(e => console.log("Autoplay blocked:", e));
        });

        call.on('error', (err) => {
          badge.innerText = "⚪ Temple Camera is Currently Offline";
          badge.className = "status-badge offline";
        });
      });

      peer.on('error', (err) => {
        badge.innerText = "⚪ Temple Camera is Currently Offline";
        badge.className = "status-badge offline";
      });
    }

    // Attempt automatic connection on page load
    window.addEventListener('load', connectToStream);
  </script>
</body>
</html>
